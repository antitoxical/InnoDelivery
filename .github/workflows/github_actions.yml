name: user service ci/cd pipeline

on: [push]

env:
  CARGO_TERM_COLOR: always

jobs:
  quality_check:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgres://admin:admin_password@localhost:5434/inno_delivery_test

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin_password
          POSTGRES_DB: inno_delivery_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run Clippy linter
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: |
          cd user_service/tests/${{ inputs.user_service }}
          cargo --version
          cargo test -- --test-threads=1



