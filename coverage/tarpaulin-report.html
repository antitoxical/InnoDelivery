DieselError::NotFound =\u003e AuthError::InvalidCredentials,\r\n            DieselError::DatabaseError(kind, info) =\u003e {\r\n                if let diesel::result::DatabaseErrorKind::UniqueViolation = kind {\r\n                    return AuthError::ValidationError(\r\n                        \"Email or phone number are already in use.\".to_string(),\r\n                    );\r\n                }\r\n                AuthError::DatabaseError(info.message().to_string())\r\n            }\r\n            _ =\u003e AuthError::DatabaseError(err.to_string()),\r\n        }\r\n    }\r\n}\r\n\r\nimpl From\u003cargon2::password_hash::Error\u003e for AuthError {\r\n    fn from(err: argon2::password_hash::Error) -\u003e AuthError {\r\n        AuthError::PasswordHashingError(err.to_string())\r\n    }\r\n}\r\n\r\nimpl From\u003cjsonwebtoken::errors::Error\u003e for AuthError {\r\n    fn from(err: jsonwebtoken::errors::Error) -\u003e AuthError {\r\n        AuthError::TokenGenerationError(err.to_string())\r\n    }\r\n}\r\n\r\npub fn register(\r\n    conn: \u0026mut PgConnection,\r\n    register_data: RegisterUserDto,\r\n) -\u003e Result\u003cDbUser, AuthError\u003e {\r\n    let role_str = match register_data.role.as_str() {\r\n        \"user\" =\u003e \"user\",\r\n        \"courier\" =\u003e \"courier\",\r\n        \"admin\" =\u003e \"admin\",\r\n        _ =\u003e return Err(AuthError::ValidationError(\"Invalid role specified\".into())),\r\n    };\r\n\r\n    if register_data.password.len() \u003c 5 {\r\n        return Err(AuthError::ValidationError(\r\n            \"Password must be at least 5 characters long\".into(),\r\n        ));\r\n    }\r\n\r\n    let salt = SaltString::generate(\u0026mut thread_rng());\r\n    let argon2 = Argon2::default();\r\n    let hashed_password = argon2\r\n        .hash_password(register_data.password.as_bytes(), \u0026salt)?\r\n        .to_string();\r\n\r\n    let db_new_user = DbNewUser {\r\n        name: register_data.name,\r\n        phone_number: register_data.phone_number,\r\n        email: register_data.email,\r\n        password: hashed_password,\r\n        role: role_str.to_string(),\r\n    };\r\n\r\n    conn.transaction(\r\n        |connection: \u0026mut PgConnection| -\u003e Result\u003cDbUser, diesel::result::Error\u003e {\r\n            let created_user = user_repository::create(connection, \u0026db_new_user)?;\r\n\r\n            if role_str == \"courier\" {\r\n                let new_courier = NewCourier {\r\n                    user_id: created_user.id,\r\n                    status: CourierStatus::Free,\r\n                    is_blocked: false,\r\n                    is_deleted: false,\r\n                };\r\n                courier_repository::create(connection, \u0026new_courier)?;\r\n            }\r\n\r\n            Ok(created_user)\r\n        },\r\n    )\r\n    .map_err(AuthError::from)\r\n}\r\n\r\npub fn login(conn: \u0026mut PgConnection, login_data: LoginUserDto) -\u003e Result\u003cAuthResponse, AuthError\u003e {\r\n    let user = user_repository::find_by_phone(conn, \u0026login_data.phone_number)?;\r\n\r\n    let parsed_hash = PasswordHash::new(\u0026user.password)?;\r\n    if Argon2::default()\r\n        .verify_password(login_data.password.as_bytes(), \u0026parsed_hash)\r\n        .is_err()\r\n    {\r\n        tracing::warn!(\r\n            \"Unsuccessful login attempt for phone: {}\",\r\n            login_data.phone_number\r\n        );\r\n        return Err(AuthError::InvalidCredentials);\r\n    }\r\n\r\n    let token = generate_jwt(\u0026user)?;\r\n    tracing::info!(\"User {} successfully logged in\", user.id);\r\n\r\n    Ok(AuthResponse {\r\n        token,\r\n        user_id: user.id,\r\n    })\r\n}\r\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","Danila","RustroverProjects","InnoDelivery","user_service","src","services","courier_service.rs"],"content":"use crate::dto::courier_dto::CourierProfileResponse;\r\nuse crate::models::courier::Courier;\r\nuse crate::models::courier::CourierStatus;\r\nuse crate::repository::courier_repository;\r\nuse crate::services::auth_service::AuthError;\r\nuse diesel::PgConnection;\r\nuse uuid::Uuid;\r\n\r\npub fn get_courier_profile(\r\n    conn: \u0026mut PgConnection,\r\n    uid: Uuid,\r\n) -\u003e Result\u003cCourierProfileResponse, AuthError\u003e {\r\n    let (user_model, courier_model) = courier_repository::find_courier_by_user_id(conn, uid)\r\n        .map_err(|e| AuthError::DatabaseError(e.to_string()))?;\r\n\r\n    let response = CourierProfileResponse {\r\n        id: user_model.id,\r\n        name: user_model.name,\r\n        phone_number: user_model.phone_number,\r\n        email: user_model.email,\r\n        status: courier_model.status,\r\n        average_rating: if courier_model.rating_count \u003e 0 {\r\n            (courier_model.rating_sum / courier_model.rating_count as f64) as f32\r\n        } else {\r\n            0.0\r\n        },\r\n    };\r\n\r\n    Ok(response)\r\n}\r\n\r\npub fn update_courier_status(\r\n    conn: \u0026mut PgConnection,\r\n    uid: Uuid,\r\n    status_data: CourierStatus,\r\n) -\u003e Result\u003cCourierStatus, AuthError\u003e {\r\n    let updated_courier = courier_repository::update_status_by_user_id(conn, uid, status_data)\r\n        .map_err(|e| AuthError::DatabaseError(e.to_string()))?;\r\n    Ok(updated_courier.status)\r\n}\r\n\r\npub fn get_all_couriers(conn: \u0026mut PgConnection) -\u003e Result\u003cVec\u003cCourierProfileResponse\u003e, AuthError\u003e {\r\n    let results =\r\n        courier_repository::get_all(conn).map_err(|e| AuthError::DatabaseError(e.to_string()))?;\r\n\r\n    let profiles = results\r\n        .into_iter()\r\n        .map(|(user_model, courier_model)| CourierProfileResponse {\r\n            id: user_model.id,\r\n            name: user_model.name,\r\n            phone_number: user_model.phone_number,\r\n            email: user_model.email,\r\n            status: courier_model.status,\r\n            average_rating: if courier_model.rating_count \u003e 0 {\r\n                (courier_model.rating_sum / courier_model.rating_count as f64) as f32\r\n            } else {\r\n                0.0\r\n            },\r\n        })\r\n        .collect();\r\n\r\n    Ok(profiles)\r\n}\r\n\r\npub fn set_courier_blocked_status(\r\n    conn: \u0026mut PgConnection,\r\n    courier_user_id: Uuid,\r\n    blocked: bool,\r\n) -\u003e Result\u003cCourier, AuthError\u003e {\r\n    courier_repository::set_blocked_status(conn, courier_user_id, blocked).map_err(AuthError::from)\r\n}\r\n\r\npub fn soft_delete_courier(\r\n    conn: \u0026mut PgConnection,\r\n    courier_user_id: Uuid,\r\n) -\u003e Result\u003cusize, AuthError\u003e {\r\n    courier_repository::soft_delete(conn, courier_user_id).map_err(AuthError::from)\r\n}\r\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","Danila","RustroverProjects","InnoDelivery","user_service","src","services","mod.rs"],"content":"pub mod auth_service;\npub mod courier_service;\npub mod user_service;\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","Danila","RustroverProjects","InnoDelivery","user_service","src","services","user_service.rs"],"content":"use crate::dto::user_dto::UpdateUser;\r\nuse crate::models::user::User as DbUser;\r\nuse crate::repository::user_repository;\r\nuse crate::services::auth_service::AuthError;\r\nuse diesel::PgConnection;\r\nuse uuid::Uuid;\r\n\r\npub fn get_user_profile(conn: \u0026mut PgConnection, user_id: Uuid) -\u003e Result\u003cDbUser, AuthError\u003e {\r\n    user_repository::find_by_id(conn, user_id).map_err(AuthError::from)\r\n}\r\n\r\npub fn update_user_profile(\r\n    conn: \u0026mut PgConnection,\r\n    user_id: Uuid,\r\n    update_data: UpdateUser,\r\n) -\u003e Result\u003cDbUser, AuthError\u003e {\r\n    user_repository::update(conn, user_id, \u0026update_data).map_err(AuthError::from)\r\n}\r\n\r\npub fn soft_delete_user(conn: \u0026mut PgConnection, user_id: Uuid) -\u003e Result\u003cusize, AuthError\u003e {\r\n    user_repository::soft_delete_user(conn, user_id).map_err(AuthError::from)\r\n}\r\n\r\npub fn get_all_users(conn: \u0026mut PgConnection) -\u003e Result\u003cVec\u003cDbUser\u003e, AuthError\u003e {\r\n    user_repository::get_all_users(conn).map_err(AuthError::from)\r\n}\r\n\r\npub fn set_user_blocked_status(\r\n    conn: \u0026mut PgConnection,\r\n    user_id: Uuid,\r\n    blocked: bool,\r\n) -\u003e Result\u003cDbUser, AuthError\u003e {\r\n    user_repository::set_blocked_status(conn, user_id, blocked).map_err(AuthError::from)\r\n}\r\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","Danila","RustroverProjects","InnoDelivery","user_service","tests","auth_tests.rs"],"content":"use chrono::Utc;\nuse jsonwebtoken::{DecodingKey, Validation, decode};\nuse user_service::auth::jwt::{Claims, generate_jwt, validate_jwt};\nuse user_service::models::user::User;\nuse uuid::Uuid;\n\nfn create_test_user(role: \u0026str) -\u003e User {\n    let now = Utc::now().naive_utc();\n    User {\n        id: Uuid::new_v4(),\n        name: \"Test User\".to_string(),\n        phone_number: \"1234567890\".to_string(),\n        email: \"test@example.com\".to_string(),\n        password: \"hashed_password\".to_string(),\n        role: role.to_string(),\n        favorite_address: None,\n        is_blocked: false,\n        is_deleted: false,\n        created_at: now,\n        updated_at: now,\n    }\n}\n\n#[test]\n/// Test 1: Checking the logic of hashing password.\nfn test_password_hashing_and_verification() {\n    use argon2::password_hash::rand_core::OsRng;\n    use argon2::password_hash::{PasswordHasher, SaltString};\n    use argon2::{Argon2, PasswordHash, PasswordVerifier};\n\n    let password = b\"password123\";\n    let salt = SaltString::generate(\u0026mut OsRng);\n    let argon2 = Argon2::default();\n\n    let password_hash_str = argon2.hash_password(password, \u0026salt).unwrap().to_string();\n    let parsed_hash = PasswordHash::new(\u0026password_hash_str).unwrap();\n\n    assert!(argon2.verify_password(password, \u0026parsed_hash).is_ok());\n    assert!(\n        argon2\n            .verify_password(b\"wrong_password\", \u0026parsed_hash)\n            .is_err()\n    );\n}\n\n#[test]\n/// Test 3: Checking JWT generation and contents of its Claims.\nfn test_jwt_generation_and_claims() {\n    dotenv::dotenv().ok();\n    let user = create_test_user(\"user\");\n    let token = generate_jwt(\u0026user).expect(\"Failed to generate JWT\");\n    let decoded = validate_jwt(\u0026token).expect(\"Failed to validate token\");\n    assert_eq!(decoded.sub, user.id.to_string());\n    assert_eq!(decoded.role, user.role);\n}\n\n#[test]\n/// Test 6: Successful validation of a correct JWT.\nfn test_jwt_validation_success() {\n    dotenv::dotenv().ok();\n    let user = create_test_user(\"admin\");\n    let token = generate_jwt(\u0026user).unwrap();\n    let result = validate_jwt(\u0026token);\n    assert!(result.is_ok());\n    assert_eq!(result.unwrap().role, \"admin\");\n}\n\n#[test]\n/// Test 9: JWT `exp` claim is set to about 24 hours in the future.\nfn test_jwt_expiration_is_set_correctly() {\n    dotenv::dotenv().ok();\n    let user = create_test_user(\"user\");\n    let token = generate_jwt(\u0026user).unwrap();\n    let claims = validate_jwt(\u0026token).unwrap();\n\n    let now = Utc::now().timestamp() as usize;\n    let twenty_four_hours_in_seconds = 24 * 60 * 60;\n\n    assert!(claims.exp \u003e now + twenty_four_hours_in_seconds - 5);\n    assert!(claims.exp \u003c now + twenty_four_hours_in_seconds + 5);\n}\n\n#[test]\n/// Test 13: JWT validation fails for invalid signature.\nfn test_jwt_validation_fails_for_invalid_signature() {\n    dotenv::dotenv().ok();\n    let user = create_test_user(\"user\");\n    let token = generate_jwt(\u0026user).unwrap();\n\n    let wrong_secret = \"a_completely_different_secret\";\n    let decoding_key = DecodingKey::from_secret(wrong_secret.as_ref());\n    let validation = Validation::default();\n\n    let result = decode::\u003cClaims\u003e(\u0026token, \u0026decoding_key, \u0026validation);\n    assert!(result.is_err());\n    assert!(matches!(\n        result.unwrap_err().kind(),\n        jsonwebtoken::errors::ErrorKind::InvalidSignature\n    ));\n}\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","Danila","RustroverProjects","InnoDelivery","user_service","tests","authorization_tests.rs"],"content":"use chrono::{Duration, Utc};\nuse user_service::auth::jwt::Claims;\nuse uuid::Uuid;\n\nfn create_test_claims(sub: String, role: String, exp_offset_secs: i64) -\u003e Claims {\n    let expiration = (Utc::now() + Duration::seconds(exp_offset_secs)).timestamp();\n    Claims {\n        sub,\n        role,\n        exp: expiration as usize,\n    }\n}\n\n#[test]\n/// Test 10: UserGuard allows user with 'user' role.\nfn test_user_guard_logic_allows_user_role() {\n    let claims = create_test_claims(Uuid::new_v4().to_string(), \"user\".to_string(), 3600);\n    assert_eq!(claims.role, \"user\");\n}\n\n#[test]\n/// Test 11: UserGuard blocks user with 'courier' role.\nfn test_user_guard_logic_blocks_courier_role() {\n    let claims = create_test_claims(Uuid::new_v4().to_string(), \"courier\".to_string(), 3600);\n    assert_ne!(claims.role, \"user\");\n}\n\n#[test]\n/// Test 12: CourierGuard allows user with 'courier' role.\nfn test_courier_guard_logic_allows_courier_role() {\n    let claims = create_test_claims(Uuid::new_v4().to_string(), \"courier\".to_string(), 3600);\n    assert_eq!(claims.role, \"courier\");\n}\n\n#[test]\n/// Test 12.1: CourierGuard blocks user with 'user' role.\nfn test_courier_guard_logic_blocks_user_role() {\n    let claims = create_test_claims(Uuid::new_v4().to_string(), \"user\".to_string(), 3600);\n    assert_ne!(claims.role, \"courier\");\n}\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","Danila","RustroverProjects","InnoDelivery","user_service","tests","error_handling_tests.rs"],"content":"use user_service::services::auth_service::AuthError;\n\n#[test]\n/// Test 2: Checking the conversion of the Diesel Error in AuthError.\nfn test_diesel_error_to_auth_error_conversion() {\n    let diesel_not_found = diesel::result::Error::NotFound;\n    let auth_error: AuthError = diesel_not_found.into();\n    assert!(matches!(auth_error, AuthError::InvalidCredentials));\n\n    let other_db_error = diesel::result::Error::QueryBuilderError(\"test\".into());\n    let auth_error: AuthError = other_db_error.into();\n    assert!(matches!(auth_error, AuthError::DatabaseError(_)));\n}\n\n#[test]\n/// Test 4: Checking the conversion of the Argon2 error in AuthError.\nfn test_argon2_error_to_auth_error_conversion() {\n    let argon2_error = argon2::password_hash::Error::Password;\n    let auth_error: AuthError = argon2_error.into();\n    assert!(matches!(auth_error, AuthError::PasswordHashingError(_)));\n    assert!(format!(\"{}\", auth_error).contains(\"Could not hash password\"));\n}\n\n#[test]\n/// Test 5: Checking the conversion of the JWT error in AuthError.\nfn test_diesel_unique_violation_error_conversion() {\n    let unique_violation_error = diesel::result::Error::DatabaseError(\n        diesel::result::DatabaseErrorKind::UniqueViolation,\n        Box::new(\"duplicate key value violates unique constraint\".to_string()),\n    );\n    let auth_error: AuthError = unique_violation_error.into();\n    assert!(matches!(auth_error, AuthError::ValidationError(_)));\n}\n\n#[test]\n/// Test 14: Conversion of JWT InvalidSignature error to AuthError.\nfn test_jwt_invalid_signature_error_conversion() {\n    let jwt_error =\n        jsonwebtoken::errors::Error::from(jsonwebtoken::errors::ErrorKind::InvalidSignature);\n    let auth_error: AuthError = jwt_error.into();\n    assert!(matches!(auth_error, AuthError::TokenGenerationError(_)));\n}\n\n#[test]\n/// Test 15: Conversion of Diesel NotNullViolation error works.\nfn test_diesel_not_null_violation_error_conversion create_test_user(role: \u0026str) -\u003e User {\r\n    let now = Utc::now().naive_utc();\r\n    User {\r\n        id: Uuid::new_v4(),\r\n        name: \"Test User\".to_string(),\r\n        phone_number: \"1234567890\".to_string(),\r\n        email: \"test@example.com\".to_string(),\r\n        password: \"hashed_password\".to_string(),\r\n        role: role.to_string(),\r\n        favorite_address: None,\r\n        is_blocked: false,\r\n        is_deleted: false,\r\n        created_at: now,\r\n        updated_at: now,\r\n    }\r\n}\r\n\r\n#[test]\r\n/// Test 16: Correct definition of courier status (Free/Busy)\r\nfn test_courier_status_enum() {\r\n    assert_eq!(format!(\"{:?}\", CourierStatus::Free), \"Free\");\r\n    assert_eq!(format!(\"{:?}\", CourierStatus::Busy), \"Busy\");\r\n}\r\n\r\n#[test]\r\n/// Test 17: User with is_blocked=true is considered blocked\r\nfn test_user_blocked_flag() {\r\n    let mut user = create_test_user(\"user\");\r\n    user.is_blocked = true;\r\n    assert!(user.is_blocked);\r\n}\r\n\r\n#[test]\r\n/// Test 18: User with is_deleted=true is considered deleted\r\nfn test_user_deleted_flag() {\r\n    let mut user = create_test_user(\"user\");\r\n    user.is_deleted = true;\r\n    assert!(user.is_deleted);\r\n}\r\n\r\n#[test]\r\n/// Test 19: Courier rating is within 0..=5\r\nfn test_courier_rating_bounds() {\r\n    let now = Utc::now().naive_utc();\r\n    let courier = Courier {\r\n        id: Uuid::new_v4(),\r\n        user_id: Uuid::new_v4(),\r\n        status: CourierStatus::Free,\r\n        rating: 4.7,\r\n        created_at: now,\r\n        updated_at: now,\r\n        is_blocked: false,\r\n        is_deleted: false,\r\n        rating_count: 0,\r\n        rating_sum: 0.0,\r\n    };\r\n    assert!((0.0..=5.0).contains(\u0026courier.rating));\r\n}\r\n\r\n#[test]\r\n/// Test 20: User email must contain '@'\r\nfn test_user_email_validity() {\r\n    let user = create_test_user(\"user\");\r\n    assert!(user.email.contains('@'));\r\n}\r\n\r\n#[test]\r\n/// Test 21: User role can only be 'user' or 'courier'\r\nfn test_user_role_allowed_values() {\r\n    let user = create_test_user(\"user\");\r\n    assert!(user.role == \"user\" || user.role == \"courier\");\r\n    let courier = create_test_user(\"courier\");\r\n    assert!(courier.role == \"user\" || courier.role == \"courier\");\r\n}\r\n\r\n#[test]\r\n/// Test 23: created_at and updated_at update correctly\r\nfn test_user_timestamps_update() {\r\n    let mut user = create_test_user(\"user\");\r\n    let old_updated = user.updated_at;\r\n    let new_time = old_updated + chrono::Duration::minutes(5);\r\n    user.updated_at = new_time;\r\n    assert!(user.updated_at \u003e old_updated);\r\n}\r\n\r\n#[test]\r\n/// Test 24: Cannot create courier without user_id (user_id must be valid UUID)\r\nfn test_courier_requires_user_id() {\r\n    let now = Utc::now().naive_utc();\r\n    let user_id = Uuid::new_v4();\r\n    let courier = Courier {\r\n        id: Uuid::new_v4(),\r\n        user_id,\r\n        status: CourierStatus::Free,\r\n        rating: 5.0,\r\n        created_at: now,\r\n        updated_at: now,\r\n        is_blocked: false,\r\n        is_deleted: false,\r\n        rating_count: 0,\r\n        rating_sum: 0.0,\r\n    };\r\n    assert_eq!(courier.user_id, user_id);\r\n}\r\n\r\n#[test]\r\n/// Test 25: Cannot update courier status to invalid value (enum is limited)\r\nfn test_courier_status_invalid_value() {\r\n    fn status_from_str(s: \u0026str) -\u003e Option\u003cCourierStatus\u003e {\r\n        match s {\r\n            \"free\" =\u003e Some(CourierStatus::Free),\r\n            \"busy\" =\u003e Some(CourierStatus::Busy),\r\n            _ =\u003e None,\r\n        }\r\n    }\r\n    assert!(status_from_str(\"free\").is_some());\r\n    assert!(status_from_str(\"busy\").is_some());\r\n    assert!(status_from_str(\"invalid\").is_none());\r\n}\r\n","traces":[],"covered":0,"coverable":0}]};

    <script>const e = React.createElement;

function pathToString(path) {
  if (path[0] === '/') {
    return '/' + path.slice(1).join('/');
  } else {
    return path.join('/');
  }
}

function findCommonPath(files) {
  if (!files || !files.length) {
    return [];
  }

  function isPrefix(arr, prefix) {
    if (arr.length < prefix.length) {
      return false;
    }
    for (let i = prefix.length - 1; i >= 0; --i) {
      if (arr[i] !== prefix[i]) {
        return false;
      }
    }
    return true;
  }

  let commonPath = files[0].path.slice(0, -1);
  while (commonPath.length) {
    if (files.every(file => isPrefix(file.path, commonPath))) {
      break;
    }
    commonPath.pop();
  }
  return commonPath;
}

function findFolders(files) {
  if (!files || !files.length) {
    return [];
  }

  let folders = files.filter(file => file.path.length > 1).map(file => file.path[0]);
  folders = [...new Set(folders)]; // unique
  folders.sort();

  folders = folders.map(folder => {
    let filesInFolder = files
      .filter(file => file.path[0] === folder)
      .map(file => ({
        ...file,
        path: file.path.slice(1),
        parent: [...file.parent, file.path[0]],
      }));

    const children = findFolders(filesInFolder); // recursion

    return {
      is_folder: true,
      path: [folder],
      parent: files[0].parent,
      children,
      covered: children.reduce((sum, file) => sum + file.covered, 0),
      coverable: children.reduce((sum, file) => sum + file.coverable, 0),
      prevRun: {
        covered: children.reduce((sum, file) => sum + file.prevRun.covered, 0),
        coverable: children.reduce((sum, file) => sum + file.prevRun.coverable, 0),
      },
    };
  });

  return [...folders, ...files.filter(file => file.path.length === 1)];
}

class App extends React.Component {
  constructor(...args) {
    super(...args);

    this.state = {
      current: [],
    };
  }

  componentDidMount() {
    this.updateStateFromLocation();
    window.addEventListener('hashchange', () => this.updateStateFromLocation(), false);
  }

  updateStateFromLocation() {
    if (window.location.hash.length > 1) {
      const current = window.location.hash.slice(1).split('/');
      this.setState({current});
    } else {
      this.setState({current: []});
    }
  }

  getCurrentPath() {
    let file = this.props.root;
    let path = [file];
    for (let p of this.state.current) {
      file = file.children.find(file => file.path[0] === p);
      if (!file) {
        return path;
      }
      path.push(file);
    }
    return path;
  }

  render() {
    const path = this.getCurrentPath();
    const file = path[path.length - 1];

    let w = null;
    if (file.is_folder) {
      w = e(FilesList, {
        folder: file,
        onSelectFile: this.selectFile.bind(this),
        onBack: path.length > 1 ? this.back.bind(this) : null,
      });
    } else {
      w = e(DisplayFile, {
        file,
        onBack: this.back.bind(this),
      });
    }

    return e('div', {className: 'app'}, w);
  }

  selectFile(file) {
    this.setState(
      ({current}) => {
        return {current: [...current, file.path[0]]};
      },
      () => this.updateHash(),
    );
  }

  back(file) {
    this.setState(
      ({current}) => {
        return {current: current.slice(0, current.length - 1)};
      },
      () => this.updateHash(),
    );
  }

  updateHash() {
    if (!this.state.current || !this.state.current.length) {
      window.location = '#';
    } else {
      window.location = '#' + this.state.current.join('/');
    }
  }
}

function FilesList({folder, onSelectFile, onBack}) {
  let files = folder.children;
  return e(
    'div',
    {className: 'display-folder'},
    e(FileHeader, {file: folder, onBack}),
    e(
      'table',
      {className: 'files-list'},
      e('thead', {className: 'files-list__head'}, e('tr', null, e('th', null, 'Path'), e('th', null, 'Coverage'))),
      e(
        'tbody',
        {className: 'files-list__body'},
        files.map(file => e(File, {file, onClick: onSelectFile})),
      ),
    ),
  );
}

function File({file, onClick}) {
  const coverage = file.coverable ? (file.covered / file.coverable) * 100 : -1;
  const coverageDelta =
    file.prevRun && (file.covered / file.coverable) * 100 - (file.prevRun.covered / file.prevRun.coverable) * 100;

  return e(
    'tr',
    {
      className:
        'files-list__file' +
        (coverage >= 0 && coverage < 50 ? ' files-list__file_low' : '') +
        (coverage >= 50 && coverage < 80 ? ' files-list__file_medium' : '') +
        (coverage >= 80 ? ' files-list__file_high' : '') +
        (file.is_folder ? ' files-list__file_folder' : ''),
      onClick: () => onClick(file),
    },
    e('td', null, e('a', null, pathToString(file.path))),
    e(
      'td',
      null,
      file.covered + ' / ' + file.coverable + (coverage >= 0 ? ' (' + coverage.toFixed(2) + '%)' : ''),
      e(
        'span',
        {title: 'Change from the previous run'},
        coverageDelta ? ` (${coverageDelta > 0 ? '+' : ''}${coverageDelta.toFixed(2)}%)` : '',
      ),
    ),
  );
}

function DisplayFile({file, onBack}) {
  return e('div', {className: 'display-file'}, e(FileHeader, {file, onBack}), e(FileContent, {file}));
}

function FileHeader({file, onBack}) {
  const coverage = (file.covered / file.coverable) * 100;
  const coverageDelta = file.prevRun && coverage - (file.prevRun.covered / file.prevRun.coverable) * 100;

  return e(
    'div',
    {className: 'file-header'},
    onBack ? e('a', {className: 'file-header__back', onClick: onBack}, 'Back') : null,
    e('div', {className: 'file-header__name'}, pathToString([...file.parent, ...file.path])),
    e(
      'div',
      {className: 'file-header__stat'},
      'Covered: ' + file.covered + ' of ' + file.coverable + (file.coverable ? ' (' + coverage.toFixed(2) + '%)' : ''),
      e(
        'span',
        {title: 'Change from the previous run'},
        coverageDelta ? ` (${coverageDelta > 0 ? '+' : ''}${coverageDelta.toFixed(2)}%)` : '',
      ),
      e('input', {id: 'theme-toggle', type: 'checkbox', hidden: true}),
      e('label', {for: 'theme-toggle', id: 'theme-toggle-label'}, '🌙'),
    ),
  );
}

function FileContent({file}) {
  return e(
    'pre',
    {className: 'file-content'},
    file.content.split(/\r?\n/).map((line, index) => {
      const trace = file.traces.find(trace => trace.line === index + 1);
      const covered = trace && trace.stats.Line;

      return e(
        'code',
        {
          className: 'code-line' + (covered ? ' code-line_covered' : '') + (uncovered ? ' code-line_uncovered' : ''),
          title: trace ? JSON.stringify(trace.stats, null, 2) : null,
        },
        line,
      );
    }),
  );
}

    path: commonPath,
    parent: [],
    covered: children.reduce((sum, file) => sum + file.covered, 0),
    coverable: children.reduce((sum, file) => sum + file.coverable, 0),
    prevRun: {
      covered: children.reduce((sum, file) => sum + file.prevRun.covered, 0),
      coverable: children.reduce((sum, file) => sum + file.prevRun.coverable, 0),
    },
  };

  ReactDOM.render(e(App, {root, prevFilesMap}), document.getElementById('root'));

  const toggle = document.getElementById('theme-toggle');
  const label = document.getElementById('theme-toggle-label');
  label.textContent = '🌙';

  toggle.addEventListener('change', () => {
    if (toggle.checked) {
      document.documentElement.setAttribute('data-theme', 'dark');
      label.textContent = '☀️';
    } else {
      document.documentElement.removeAttribute('data-theme');
      label.textContent = '🌙';
    }
  });
})();
</script>
</body>
</html>
