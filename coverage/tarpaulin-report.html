<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <style>:root {
  --color: black;
  --bg: white;
  --head-bg: white;
  --link: #338;

  --blue: #ccf;
  --red: #fcc;
  --yellow: #ffc;
  --green: #cfc;
}

[data-theme='dark'] {
  --color: white;
  --bg: black;
  --head-bg: #333;
  --link: #aaf;

  --blue: #225;
  --red: #522;
  --yellow: #552;
  --green: #252;
}

html,
body {
  margin: 0;
  padding: 0;
  color: var(--color);
  background: var(--bg);
}

.app {
  margin: 10px;
  padding: 0;
}

.files-list {
  margin: 10px 0 0;
  width: 100%;
  border-collapse: collapse;
}
.files-list__head {
  border: 1px solid #999;
}
.files-list__head > tr > th {
  padding: 10px;
  border: 1px solid #999;
  text-align: left;
  font-weight: normal;
  background: var(--head-bg);
}
.files-list__body {
}
.files-list__file {
  cursor: pointer;
}
.files-list__file:hover {
  background: var(--blue);
}
.files-list__file > td {
  padding: 10px;
  border: 1px solid #999;
}
.files-list__file > td:first-child::before {
  content: '\01F4C4';
  margin-right: 1em;
}
.files-list__file_low {
  background: var(--red);
}
.files-list__file_medium {
  background: var(--yellow);
}
.files-list__file_high {
  background: var(--green);
}
.files-list__file_folder > td:first-child::before {
  content: '\01F4C1';
  margin-right: 1em;
}

.file-header {
  border: 1px solid #999;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  background: var(--bg);
}

.file-header__back {
  margin: 10px;
  cursor: pointer;
  flex-shrink: 0;
  flex-grow: 0;
  text-decoration: underline;
  color: var(--link);
}

.file-header__name {
  margin: 10px;
  flex-shrink: 2;
  flex-grow: 2;
}

.file-header__stat {
  margin: 10px;
  flex-shrink: 0;
  flex-grow: 0;
}

.file-content {
  margin: 10px 0 0;
  border: 1px solid #999;
  padding: 10px;
  counter-reset: line;
  display: flex;
  flex-direction: column;
}

.code-line::before {
  content: counter(line);
  margin-right: 10px;
}
.code-line {
  margin: 0;
  padding: 0.3em;
  height: 1em;
  counter-increment: line;
}
.code-line_covered {
  background: var(--green);
}
.code-line_uncovered {
  background: var(--red);
}

#theme-toggle-label {
  margin-left: 1ch;
}
</style>
</head>

esel::update(orders::table.find(order_uuid))\r\n        .set(orders::status.eq(new_status))\r\n        .get_result(conn)\r\n}\r\n\r\npub fn update_order_address(\r\n    conn: \u0026mut PgConnection,\r\n    order_uuid: Uuid,\r\n    new_address: \u0026str,\r\n) -\u003e Result\u003cOrder, DieselError\u003e {\r\n    diesel::update(orders::table.find(order_uuid))\r\n        .set(orders::delivery_address.eq(new_address))\r\n        .get_result(conn)\r\n}\r\n\r\npub fn list_orders_by_user(\r\n    conn: \u0026mut PgConnection,\r\n    user_uuid: Uuid,\r\n    limit: i64,\r\n    offset: i64,\r\n) -\u003e Result\u003cVec\u003cOrder\u003e, DieselError\u003e {\r\n    orders::table\r\n        .filter(orders::user_id.eq(user_uuid))\r\n        .order(orders::created_at.desc())\r\n        .limit(limit)\r\n        .offset(offset)\r\n        .load::\u003cOrder\u003e(conn)\r\n}\r\n\r\npub fn find_missing_product_ids(\r\n    conn: \u0026mut PgConnection,\r\n    product_ids: \u0026[Uuid],\r\n) -\u003e Result\u003cVec\u003cUuid\u003e, DieselError\u003e {\r\n    if product_ids.is_empty() {\r\n        return Ok(vec![]);\r\n    }\r\n\r\n    let existing: Vec\u003cUuid\u003e = products::table\r\n        .filter(products::id.eq_any(product_ids))\r\n        .select(products::id)\r\n        .load(conn)?;\r\n\r\n    let existing_set: std::collections::HashSet\u003cUuid\u003e = existing.into_iter().collect();\r\n\r\n    Ok(product_ids\r\n        .iter()\r\n        .cloned()\r\n        .filter(|id| !existing_set.contains(id))\r\n        .collect())\r\n}\r\n\r\npub fn find_expired_pending_orders(\r\n    conn: \u0026mut PgConnection,\r\n    created_before: chrono::NaiveDateTime,\r\n) -\u003e Result\u003cVec\u003cOrder\u003e, DieselError\u003e {\r\n    use crate::schema::orders::dsl::{created_at, status};\r\n\r\n    crate::schema::orders::table\r\n        .filter(status.eq(OrderStatus::PendingCarrier))\r\n        .filter(created_at.lt(created_before))\r\n        .load::\u003cOrder\u003e(conn)\r\n}\r\n\r\npub fn update_order_status_and_courier(\r\n    conn: \u0026mut PgConnection,\r\n    order_uuid: Uuid,\r\n    new_status: OrderStatus,\r\n    courier_id: Option\u003cUuid\u003e,\r\n) -\u003e Result\u003cOrder, DieselError\u003e {\r\n    diesel::update(orders::table.find(order_uuid))\r\n        .set((\r\n            orders::status.eq(new_status),\r\n            orders::courier_id.eq(courier_id),\r\n            orders::updated_at.eq(chrono::Utc::now().naive_utc()),\r\n        ))\r\n        .get_result(conn)\r\n}\r\n\r\npub fn rate_order_in_window(\r\n    conn: \u0026mut PgConnection,\r\n    order_uuid: Uuid,\r\n    rating: f32,\r\n    rating_window_minutes: i32,\r\n) -\u003e Result\u003cOrder, DieselError\u003e {\r\n    use crate::schema::orders;\r\n\r\n    if !(1.0..=5.0).contains(\u0026rating) {\r\n        return Err(DieselError::QueryBuilderError(\r\n            \"Invalid rating value\".into(),\r\n        ));\r\n    }\r\n\r\n    let rating_window = chrono::Duration::minutes(i64::from(rating_window_minutes));\r\n    let max_rating_time = chrono::Utc::now().naive_utc() - rating_window;\r\n\r\n    diesel::update(\r\n        orders::table\r\n            .find(order_uuid)\r\n            .filter(orders::status.eq(OrderStatus::Finished))\r\n            .filter(orders::updated_at.gt(max_rating_time))\r\n            .filter(orders::rating.is_null()),\r\n    )\r\n    .set((\r\n        orders::rating.eq(rating),\r\n        orders::updated_at.eq(chrono::Utc::now().naive_utc()),\r\n    ))\r\n    .get_result(conn)\r\n}\r\n","traces":[{"line":13,"address":[],"length":0,"stats":{"Line":2666130979403333632}},{"line":18,"address":[],"length":0,"stats":{"Line":10664523917613334528}},{"line":19,"address":[],"length":0,"stats":{"Line":15852670688344145920}},{"line":20,"address":[],"length":0,"stats":{"Line":10664523917613334528}},{"line":21,"address":[],"length":0,"stats":{"Line":10808639105689190400}},{"line":23,"address":[],"length":0,"stats":{"Line":15564440312192434176}},{"line": n        product_type -\u003e Varchar,\r\n        product_name -\u003e Varchar,\r\n        restaurant -\u003e Varchar,\r\n        price -\u003e Float4,\r\n        created_at -\u003e Timestamp,\r\n        updated_at -\u003e Timestamp,\r\n    }\r\n}\r\n\r\ndiesel::joinable!(order_products -\u003e orders (order_id));\r\ndiesel::joinable!(order_products -\u003e products (product_id));\r\n\r\ndiesel::allow_tables_to_appear_in_same_query!(order_products, orders, products,);\r\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","Danila","RustroverProjects","InnoDelivery","order_service","src","services","mod.rs"],"content":"pub mod order_service;\r\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","Danila","RustroverProjects","InnoDelivery","order_service","src","services","order_service.rs"],"content":"use crate::db::DbPool;\nuse crate::models::{NewOrder, Order, OrderStatus};\nuse crate::repository::order_repository::{self, OrderProductData};\nuse log;\nuse reqwest;\nuse std::fmt;\nuse uuid::Uuid;\n\n#[derive(Debug, Clone)]\npub enum OrderServiceError {\n    DatabaseError(String),\n    UserServiceError(String),\n    InvalidInput(String),\n    RatingWindowExpired,\n    InvalidRating,\n}\n\nimpl fmt::Display for OrderServiceError {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter) -\u003e fmt::Result {\n        match self {\n            OrderServiceError::DatabaseError(e) =\u003e write!(f, \"Database error: {}\", e),\n            OrderServiceError::UserServiceError(e) =\u003e write!(f, \"User service error: {}\", e),\n            OrderServiceError::InvalidInput(e) =\u003e write!(f, \"Invalid input: {}\", e),\n            OrderServiceError::RatingWindowExpired =\u003e write!(f, \"Rating window has expired\"),\n            OrderServiceError::InvalidRating =\u003e write!(f, \"Invalid rating value\"),\n        }\n    }\n}\n\nimpl From\u003cdiesel::result::Error\u003e for OrderServiceError {\n    fn from(error: diesel::result::Error) -\u003e Self {\n        OrderServiceError::DatabaseError(error.to_string())\n    }\n}\n\nimpl From\u003creqwest::Error\u003e for OrderServiceError {\n    fn from(error: reqwest::Error) -\u003e Self {\n        OrderServiceError::UserServiceError(error.to_string())\n    }\n}\n\nfn handle_rating_error(e: diesel::result::Error) -\u003e OrderServiceError {\n    if e == diesel::result::Error::NotFound || e == diesel::result::Error::RollbackTransaction {\n        OrderServiceError::RatingWindowExpired\n    } else {\n        OrderServiceError::DatabaseError(e.to_string())\n    }\n}\n\npub async fn rate_order(\n    pool: \u0026DbPool,\n    user_service_url: \u0026str,\n    order_id: Uuid,\n    user_id: Uuid,\n    rating: f32,\n    rating_window_minutes: i32,\n) -\u003e Result\u003cOrder, OrderServiceError\u003e {\n    if !(1.0..=5.0).contains(\u0026rating) {\n        return Err(OrderServiceError::InvalidRating);\n    }\n\n    let mut conn = pool\n        .get()\n        .map_err(|e| OrderServiceError::DatabaseError(e.to_string()))?;\n\n    let order = order_repository::find_order_by_id(\u0026mut conn, order_id)?;\n\n    if order.user_id != user_id {\n        return Err(OrderServiceError::InvalidInput(\n            \"Order not found\".to_string(),\n        ));\n    }\n\n    let updated_order =\n        order_repository::rate_order_in_window(\u0026mut conn, order_id, rating, rating_window_minutes)\n            .map_err(handle_rating_error)?;\n\n    if let Some(courier_id) = updated_order.courier_id {\n        let client = reqwest::Client::new();\n        let url = format!(\"{}/internal/couriers/set_rating\", user_service_url);\n        let body = serde_json::json!({\n            \"courier_id\": courier_id,\n            \"rating\": rating\n        });\n\n        match client.post(\u0026url).json(\u0026body).send().await {\n            Ok(response) =\u003e {\n                if response.status().is_success() {\n                    log::info!(\"Successfully updated courier rating in user_service\");\n                } else {\n                    log::error!(\n                        \"Failed to update courier rating: HTTP {}\",\n                        response.status()\n                    );\n                }\n            }\n            Err(e) =\u003e {\n                log::error!(\"Error calling user_service to update rating: {}\", e);\n            }\n        }\n    }\n\n    Ok(updated_order)\n}\n\npub async fn create_order(\n    pool: \u0026DbPool,\n    user_service_url: \u0026str,\n    user_id: Uuid,\n    delivery_address: \u0026str,\n    products: Vec\u003cOrderProductData\u003e,\n) -\u003e Result\u003cOrder, OrderServiceError\u003e {\n    log::info!(\n        \"[CREATE_ORDER] Called with user_id={}, delivery_address={}, products={:?}\",\n        user_id,\n        delivery_address,\n        products\n    );\n\n    let mut conn = pool\n        .get()\n        .map_err(|e| OrderServiceError::DatabaseError(e.to_string()))?;\n\n    let product_ids: Vec\u003cUuid\u003e = products.iter().map(|p| p.product_id).collect();\n    let missing = order_repository::find_missing_product_ids(\u0026mut conn, \u0026product_ids)?;\n    if !missing.is_empty() {\n        log::warn!(\"[CREATE_ORDER] Missing products: {:?}\", missing);\n        return Err(OrderServiceError::InvalidInput(format!(\n            \"Unknown product ids: {:?}\",\n            missing\n        )));\n    }\n\n    if is_user_blocked(user_service_url, user_id).await? {\n        log::warn!(\"[CREATE_ORDER] User is blocked: {}\", user_id);\n        return Err(OrderServiceError::InvalidInput(\n            \"User is blocked\".to_string(),\n        ));\n    }\n\n    let courier_id_option = try_assign_courier(user_service_url).await?;\n    log::info!(\n        \"[CREATE_ORDER] Courier assignment result: {:?}\",\n        courier_id_option\n    );\n    let order_status;\n    let final_courier_id;\n\n    if let Some(courier_id) = courier_id_option {\n        let busy_result = set_courier_busy(user_service_url, courier_id).await;\n        log::debug!(\"[CREATE_ORDER] set_courier_busy result: {:?}\", busy_result);\n        if busy_result.is_ok() {\n            order_status = OrderStatus::InProgress;\n            final_courier_id = Some(courier_id);\n        } else {\n            log::warn!(\"[CREATE_ORDER] set_courier_busy failed, courier will not be assigned\");\n            let _ = release_courier(user_service_url, courier_id).await;\n            order_status = OrderStatus::PendingCarrier;\n            final_courier_id = None;\n        }\n    } else {\n        log::info!(\"[CREATE_ORDER] No courier assigned, status PendingCarrier\");\n        order_status = OrderStatus::PendingCarrier;\n        final_courier_id = None;\n    }\n\n    let new_order = NewOrder {\n        user_id,\n        courier_id: final_courier_id,\n        delivery_address: delivery_address.to_string(),\n        status: order_status,\n    };\n    log::info!(\"[CREATE_ORDER] NewOrder struct: {:?}\", new_order);\n\n    let result = order_repository::create_order(\u0026mut conn, new_order, products);\n    match \u0026result {\n        Ok(order) =\u003e {\n            log::info!(\n                \"[CREATE_ORDER] Order successfully created! id={:?}\",\n                order.id\n            );\n        }\n        Err(e) =\u003e {\n            log::error!(\"[CREATE_ORDER] Error during order creation: {:?}\", e);\n        }\n    }\n    result.map_err(OrderServiceError::from)\n}\n\npub async fn set_courier_busy(\n    user_service_url: \u0026str,\n    courier_id: Uuid,\n) -\u003e Result\u003c(), OrderServiceError\u003e {\n    let url = format!(\"{}/internal/couriers/busy\", user_service_url);\n    let body = serde_json::json!({\n        \"courier_id\": courier_id\n    });\n    reqwest::Client::new()\n        .post(\u0026url)\n        .json(\u0026body)\n        .send()\n        .await?\n        .error_for_status()?;\n    Ok(())\n}\n\npub async fn is_user_blocked(\n    user_service_url: \u0026str,\n    user_id: Uuid,\n) -\u003e Result\u003cbool, OrderServiceError\u003e {\n    let url = format!(\"{}/internal/users/{}/blocked\", user_service_url, user_id);\n    log::debug!(\" Sending request to: {}\", url);\n\n    let client = reqwest::Client::new();\n    let resp = client.get(\u0026url).send().await?;\n\n    log::debug!(\" Received response status: {}\", resp.status());\n\n    if resp.status().is_success() {\n        let body = resp.text().await?;\n        log::debug!(\" Response body: {}\", body);\n\n        let v: serde_json::Value = serde_json::from_str(\u0026body).map_err(|e| {\n            OrderServiceError::UserServiceError(format!(\"Failed to parse JSON: {}\", e))\n        })?;\n\n        Ok(v.get(\"is_blocked\")\n            .and_then(|b| b.as_bool())\n            .unwrap_or(false))\n    } else {\n        log::error!(\" Request failed with status: {}\", resp.status());\n        Err(OrderServiceError::UserServiceError(format!(\n            \"User service returned error status: {}\",\n            resp.status()\n        )))\n    }\n}\n\npub async fn try_assign_courier(user_service_url: \u0026str) -\u003e Result\u003cOption\u003cUuid\u003e, OrderServiceError\u003e {\n    let url = format!(\"{}/internal/couriers/assign\", user_service_url);\n    log::debug!(\" Sending courier assignment request to: {}\", url);\n\n    let client = reqwest::Client::new();\n    let resp = client.post(\u0026url).send().await?;\n\n    log::debug!(\" Received response status: {}\", resp.status());\n\n    if resp.status().as_u16() == 204 {\n        log::debug!(\" No courier available (204 No Content)\");\n        return Ok(None);\n    }\n\n    if resp.status().is_success() {\n        let body = resp.text().await?;\n        log::debug!(\" Response body: {}\", body);\n\n        let v: serde_json::Value = serde_json::from_str(\u0026body).map_err(|e| {\n            OrderServiceError::UserServiceError(format!(\"Failed to parse JSON: {}\", e))\n        })?;\n\n        let id = v\n            .get(\"courier_id\")\n            .and_then(|s| s.as_str())\n            .and_then(|s| Uuid::parse_str(s).ok());\n\n        log::debug!(\" Parsed courier_id: {:?}\", id);\n        Ok(id)\n    } else {\n        let status = resp.status();\n        let body = resp.text().await.map_err(|e| {\n            OrderServiceError::UserServiceError(format!(\"Failed to get response body: {}\", e))\n        })?;\n        let error_msg = format!(\n            \"User service returned unexpected status: {} - Body: {}\",\n            status, body\n        );\n        log::error!(\"{}\", error_msg);\n        Err(OrderServiceError::UserServiceError(error_msg))\n    }\n}\npub async fn release_courier(\n    user_service_url: \u0026str,\n    courier_id: Uuid,\n) -\u003e Result\u003c(), reqwest::Error\u003e {\n    let url = format!(\"{}/internal/couriers/free\", user_service_url);\n    let body = serde_json::json!({\"courier_id\": courier_id});\n    let resp = reqwest::Client::new().post(\u0026url).json(\u0026body).send().await?;\n\n    if resp.status().is_success() {\n        Ok(())\n    } else {\n        Err(resp.error_for_status().unwrap_err())\n    }\n}\n\npub async fn complete_order(\n    pool: \u0026DbPool,\n    user_service_url: \u0026str,\n    order_id: Uuid,\n) -\u003e Result\u003cOrder, OrderServiceError\u003e {\n    let mut conn = pool\n        .get()\n        .map_err(|e| OrderServiceError::DatabaseError(e.to_string()))?;\n\n    let order = order_repository::find_order_by_id(\u0026mut conn, order_id)?;\n    if let Some(courier_id) = order.courier_id {\n        release_courier(user_service_url, courier_id).await?;\n    }\n    order_repository::update_order_status(\u0026mut conn, order_id, OrderStatus::Finished)\n        .map_err(OrderServiceError::from)?;\n    let updated_order = order_repository::find_order_by_id(\u0026mut conn, order_id)?;\n    Ok(updated_order)\n}\n\npub async fn process_pending_orders(\n    pool: \u0026DbPool,\n    user_service_url: \u0026str,\n    timeout_seconds: i64,\n) -\u003e Result\u003cusize, OrderServiceError\u003e {\n    let mut conn = pool\n        .get()\n        .map_err(|e| OrderServiceError::DatabaseError(e.to_string()))?;\n\n    let pending_orders = order_repository::find_expired_pending_orders(\n        \u0026mut conn,\n        chrono::Utc::now().naive_utc() - chrono::Duration::seconds(timeout_seconds),\n    )?;\n\n    let mut processed = 0;\n\n    for order in pending_orders {\n        if let Some(courier_id) = try_assign_courier(user_service_url).await? {\n            order_repository::update_order_status_and_courier(\n                \u0026mut conn,\n                order.id,\n                OrderStatus::InProgress,\n                Some(courier_id),\n            )?;\n        } else {\n            order_repository::update_order_status(\u0026mut conn, order.id, OrderStatus::Cancelled)?;\n        }\n\n        processed += 1;\n    }\n\n    Ok(processed)\n}\n\npub async fn cancel_order_wrapper(\n    pool: \u0026DbPool,\n    order_id: Uuid,\n) -\u003e Result\u003cOrder, OrderServiceError\u003e {\n    let mut conn = pool\n        .get()\n        .map_err(|e| OrderServiceError::DatabaseError(e.to_string()))?;\n    order_repository::update_order_status(\u0026mut conn, order_id, OrderStatus::Cancelled)\n        .map_err(OrderServiceError::from)?;\n    let updated_order = order_repository::find_order_by_id(\u0026mut conn, order_id)?;\n    Ok(updated_order)\n}\n\npub async fn update_order_address(\n    pool: \u0026DbPool,\n    order_id: Uuid,\n    new_address: \u0026str,\n) -\u003e Result\u003cOrder, OrderServiceError\u003e {\n    log::info!(\n        \"[UPDATE_ADDRESS] Called for order_id={} with new_address={}\",\n        order_id,\n        new_address\n    );\n\n    let mut conn = pool\n        .get()\n        .map_err(|e| OrderServiceError::DatabaseError(e.to_string()))?;\n\n    let updated_order = order_repository::update_order_address(\u0026mut conn, order_id, new_address)?;\n\n    log::info!(\n        \"[UPDATE_ADDRESS] Successfully updated address for order_id={}\",\n        order_id\n    );\n\n    Ok(updated_order)\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use diesel::result::Error as DieselError;\n\n    #[test]\n    fn test_handle_rating_error_not_found() {\n        let err = DieselError::NotFound;\n        let res = handle_rating_error(err);\n        assert!(matches!(res, OrderServiceError::RatingWindowExpired));\n    }\n\n    #[test]\n    fn test_handle_rating_error_rollback() {\n        let err = DieselError::RollbackTransaction;\n        let res = handle_rating_error(err);\n        assert!(matches!(res, OrderServiceError::RatingWindowExpired));\n    }\n\n    #[test]\n    fn test_handle_rating_error_other() {\n        let custom_msg = \"My custom DB error\";\n        let err = DieselError::QueryBuilderError(custom_msg.into());\n        let res = handle_rating_error(err);\n        if let OrderServiceError::DatabaseError(msg) = res {\n            assert!(msg.contains(custom_msg));\n        } else {\n            panic!(\"Expected DatabaseError\");\n        }\n    }\n}\n","traces":[{"line":19,"address":[],"length":0,"stats":{"Line":4035225266123964416}},{"line":20,"address":[],"length":0,"stats":{"Line":4035225266123964416}},{"line":21,"address":[],"length":0,"stats":{"Line":6341068275337658368}},{"line":22,"address":[],"length":0,"stats":{"Line":2882303761517117440}},{"line":23,"address":[],"length":0,"stats":{"Line":3458764513820540928}},{"line":24,"address":[],"length":0,"stats":{"Line":864691128455135232}},{"line":25,"address":[],"length":0,"stats":{"Line":1729382256910270464}},{"line":31,"address":[],"length":0,"stats":{"Line":1152921504606846976}},{"line":32,"address":[],"length":0,"stats":{"Line":1152921504606846976}},{"line":37,"address":[],"length":0,"stats":{"Line":720575940379279360}},{"line":38,"address":[],"length":0,"stats":{"Line":720575940379279360}},{"line":42,"address":[],"length":0,"stats":{"Line":576460752303423488}},{"line":43     let mut buf = [0u8; 1024];\n            // Блокирующее чтение\n            let _ = stream.read(\u0026mut buf);\n\n            // Отправляем заголовки: статус 500 и Content-Length: 100\n            let response = b\"HTTP/1.1 500 Internal Server Error\\r\\n\\\n                             Content-Type: text/plain\\r\\n\\\n                             Content-Length: 100\\r\\n\\\n                             \\r\\n\\\n                             Short\"; // Тело короче, чем заявлено (всего 5 байт)\n\n            // Блокирующая запись\n            let _ = stream.write(response);\n            // Поток завершается, соединение закрывается.\n            // Клиент (reqwest) ждет еще 95 байт и падает с ошибкой \"premature EOF\".\n        }\n    });\n\n    // Асинхронный вызов сервиса\n    let result =\n        order_service::services::order_service::try_assign_courier(\u0026user_service_url).await;\n\n    assert!(result.is_err());\n    let err_msg = result.unwrap_err().to_string();\n\n    // Проверяем, что сработала ветка map_err (строка 271)\n    assert!(err_msg.contains(\"Failed to get response body\"));\n}\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","Danila","RustroverProjects","InnoDelivery","order_service","tests","integration_tests","order_service_correct_tracing.rs"],"content":"use crate::helpers;\nuse httpmock::Method::{GET, POST};\nuse order_service::repository::order_repository::OrderProductData;\nuse serde_json::json;\nuse std::env;\nuse tracing::Level;\nuse uuid::Uuid;\n\n#[tokio::test]\nasync fn test_logging_coverage_create_order() {\n    dotenvy::dotenv().ok();\n\n    let _ = tracing_subscriber::fmt()\n        .with_max_level(Level::DEBUG)\n        .with_test_writer()\n        .try_init();\n\n    let db_url = env::var(\"DATABASE_URL_ORDER_TEST\").expect(\"Env var not set\");\n    let (_app, pool, server) = helpers::setup_test_app(\u0026db_url).await;\n\n    let user_id = Uuid::new_v4();\n    let courier_id = Uuid::new_v4();\n    let tion/json\")\n            .body(r#\"{\"is_blocked\":false}\"#);\n    });\n    let res = is_user_blocked(\u0026server.base_url(), uid).await.unwrap();\n    assert!(!res);\n\n    mock.assert();\n}\n\n#[tokio::test]\nasync fn is_user_blocked_missing_field_false() {\n    let server = MockServer::start_async().await;\n    let uid = Uuid::new_v4();\n    let path = format!(\"/internal/users/{}/blocked\", uid);\n    let mock = server.mock(|when, then| {\n        when.method(GET).path(path.as_str());\n        then.status(200)\n            .header(\"content-type\", \"application/json\")\n            .body(r#\"{\"other_field\":123}\"#);\n    });\n    let res = is_user_blocked(\u0026server.base_url(), uid).await.unwrap();\n    assert!(!res);\n\n    mock.assert();\n}\n\n#[tokio::test]\nasync fn is_user_blocked_non_200_false() {\n    let server = MockServer::start_async().await;\n    let uid = Uuid::new_v4();\n    let path = format!(\"/internal/users/{}/blocked\", uid);\n    let mock = server.mock(|when, then| {\n        when.method(GET).path(path.as_str());\n        then.status(404);\n    });\n\n    let res = is_user_blocked(\u0026server.base_url(), uid).await;\n    assert!(res.is_err());\n\n    mock.assert();\n}\n\n#[tokio::test]\nasync fn is_user_blocked_malformed_json_false() {\n    let server = MockServer::start_async().await;\n    let uid = Uuid::new_v4();\n    let path = format!(\"/internal/users/{}/blocked\", uid);\n    let mock = server.mock(|when, then| {\n        when.method(GET).path(path.as_str());\n        then.status(200).body(\"invalid json\");\n    });\n\n    let res = is_user_blocked(\u0026server.base_url(), uid).await;\n    assert!(res.is_err());\n\n    mock.assert();\n}\n\n#[tokio::test]\nasync fn is_user_blocked_whitespace_body_false() {\n    let server = MockServer::start_async().await;\n    let uid = Uuid::new_v4();\n    let path = format!(\"/internal/users/{}/blocked\", uid);\n    let mock = server.mock(|when, then| {\n        when.method(GET).path(path.as_str());\n        then.status(200).body(\"   \");\n    });\n    let res = is_user_blocked(\u0026server.base_url(), uid).await;\n    assert!(res.is_err());\n\n    mock.assert();\n}\n\n#[tokio::test]\nasync fn is_user_blocked_network_error() {\n    let url = \"http://127.0.0.1:1\".to_string();\n    let uid = Uuid::new_v4();\n    let res = is_user_blocked(\u0026url, uid).await;\n    assert!(res.is_err());\n}\n\n#[tokio::test]\nasync fn set_courier_busy_ok_on_200() {\n    let server = MockServer::start_async().await;\n    let cid = Uuid::new_v4();\n    let mock = server.mock(|when, then| {\n        when.method(POST)\n            .path(\"/internal/couriers/busy\")\n            .header(\"content-type\", \"application/json\")\n            .json_body(serde_json::json!({\"courier_id\": cid}));\n        then.status(200);\n    });\n    let res = set_courier_busy(\u0026server.base_url(), cid).await;\n    mock.assert();\n    assert!(res.is_ok());\n}\n\n#[tokio::test]\nasync fn set_courier_busy_err_on_non_200() {\n    let server = MockServer::start_async().await;\n    let cid = Uuid::new_v4();\n    let mock = server.mock(|when, then| {\n        when.method(POST).path(\"/internal/couriers/busy\");\n        then.status(404);\n    });\n    let res = set_courier_busy(\u0026server.base_url(), cid).await;\n    mock.assert();\n    assert!(res.is_err());\n}\n\n#[tokio::test]\nasync fn release_courier_ok_on_200() {\n    let server = MockServer::start_async().await;\n    let cid = Uuid::new_v4();\n    let mock = server.mock(|when, then| {\n        when.method(POST)\n            .path(\"/internal/couriers/free\")\n            .header(\"content-type\", \"application/json\")\n            .json_body(serde_json::json!({\"courier_id\": cid}));\n        then.status(200);\n    });\n    let res = release_courier(\u0026server.base_url(), cid).await;\n    mock.assert();\n    assert!(res.is_ok());\n}\n\n#[tokio::test]\nasync fn release_courier_err_on_non_200() {\n    let server = MockServer::start_async().await;\n    let cid = Uuid::new_v4();\n    let mock = server.mock(|when, then| {\n        when.method(POST).path(\"/internal/couriers/free\");\n        then.status(500).body(\"Internal Server Error\");\n    });\n    let res = release_courier(\u0026server.base_url(), cid).await;\n    mock.assert();\n    assert!(res.is_err());\n}\n\n#[test]\nfn test_diesel_other_error_converts_to_database_error() {\n    let diesel_err = DieselError::RollbackTransaction;\n    let service_err: OrderServiceError = diesel_err.into();\n\n    assert!(matches!(service_err, OrderServiceError::DatabaseError(_)));\n    assert!(service_err.to_string().contains(\"Database error\"));\n}\n\n#[test]\nfn test_graphql_display_implementation() {\n    let err = GraphQLError::NotFound;\n    assert_eq!(format!(\"{}\", err), \"Resource not found\");\n\n    let err = GraphQLError::InvalidInput(\"empty list\".to_string());\n    assert_eq!(format!(\"{}\", err), \"Invalid input: empty list\");\n}\n\n#[test]\nfn test_graphql_from_conversions() {\n    let conn_error = diesel::ConnectionError::BadConnection(\"Test connection error\".to_string());\n\n    let r2d2_err = diesel::r2d2::Error::ConnectionError(conn_error);\n\n    let graphql_err: GraphQLError = r2d2_err.into();\n\n    assert!(matches!(graphql_err, GraphQLError::ConnectionError(_)));\n\n    if let GraphQLError::ConnectionError(msg) = graphql_err {\n        assert!(msg.contains(\"Test connection error\"));\n    }\n\n    let async_err = async_graphql::Error::new(\"Async error\");\n    let graphql_err: GraphQLError = async_err.into();\n    assert!(matches!(graphql_err, GraphQLError::InvalidInput(_)));\n}\n\n#[test]\nfn test_graphql_error_extensions_codes() {\n    let db_err = GraphQLError::DatabaseError(\"Db fail\".to_string());\n    let field_error = db_err.extend();\n\n    let extensions = field_error\n        .extensions\n        .as_ref()\n        .expect(\"Extensions should exist\");\n\n    assert_eq!(\n        extensions.get(\"code\"),\n serDto};\r\nuse crate::models::courier::{CourierStatus, NewCourier};\r\nuse crate::models::user::{NewUser as DbNewUser, User as DbUser};\r\nuse crate::repository::{courier_repository, user_repository};\r\nuse argon2::{\r\n    Argon2,\r\n    password_hash::{PasswordHash, PasswordHasher, PasswordVerifier, SaltString},\r\n};\r\nuse diesel::prelude::*;\r\nuse diesel::result::Error as DieselError;\r\nuse jsonwebtoken;\r\nuse rand::thread_rng;\r\nuse serde::Serialize;\r\nuse std::fmt;\r\nuse tracing;\r\n\r\n#[derive(Debug, Serialize)]\r\npub enum AuthError {\r\n    DatabaseError(String),\r\n    PasswordHashingError(String),\r\n    InvalidCredentials,\r\n    TokenGenerationError(String),\r\n    ValidationError(String),\r\n    ConnectionError(String),\r\n}\r\n\r\nimpl fmt::Display for AuthError {\r\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter) -\u003e fmt::Result {\r\n        match self {\r\n            AuthError::DatabaseError(e) =\u003e write!(f, \"Database error: {}\", e),\r\n            AuthError::PasswordHashingError(e) =\u003e write!(f, \"Could not hash password: {}\", e),\r\n            AuthError::InvalidCredentials =\u003e write!(f, \"Invalid phone number or password\"),\r\n            AuthError::TokenGenerationError(e) =\u003e write!(f, \"Could not generate token: {}\", e),\r\n            AuthError::ValidationError(e) =\u003e write!(f, \"Validation error: {}\", e),\r\n            AuthError::ConnectionError(e) =\u003e write!(f, \"Connection error: {}\", e),\r\n        }\r\n    }\r\n}\r\n\r\nimpl From\u003cDieselError\u003e for AuthError {\r\n    fn from(err: DieselError) -\u003e AuthError {\r\n        match err {\r\n            DieselError::NotFound =\u003e AuthError::InvalidCredentials,\r\n            DieselError::DatabaseError(kind, info) =\u003e {\r\n                if let diesel::result::DatabaseErrorKind::UniqueViolation = kind {\r\n                    return AuthError::ValidationError(\r\n                        \"Email or phone number are already in use.\".to_string(),\r\n                    );\r\n                }\r\n                AuthError::DatabaseError(info.message().to_string())\r\n            }\r\n            _ =\u003e AuthError::DatabaseError(err.to_string()),\r\n        }\r\n    }\r\n}\r\n\r\nimpl From\u003cargon2::password_hash::Error\u003e for AuthError {\r\n    fn from(err: argon2::password_hash::Error) -\u003e AuthError {\r\n        AuthError::PasswordHashingError(err.to_string())\r\n    }\r\n}\r\n\r\nimpl From\u003cjsonwebtoken::errors::Error\u003e for AuthError {\r\n    fn from(err: jsonwebtoken::errors::Error) -\u003e AuthError {\r\n        AuthError::TokenGenerationError(err.to_string())\r\n    }\r\n}\r\n\r\npub fn register(\r\n    conn: \u0026mut PgConnection,\r\n    register_data: RegisterUserDto,\r\n) -\u003e Result\u003cDbUser, AuthError\u003e {\r\n    let role_str = match register_data.role.as_str() {\r\n        \"user\" =\u003e \"user\",\r\n        \"courier\" =\u003e \"courier\",\r\n        \"admin\" =\u003e \"admin\",\r\n        _ =\u003e return Err(AuthError::ValidationError(\"Invalid role specified\".into())),\r\n    };\r\n\r\n    if register_data.password.len() \u003c 5 {\r\n        return Err(AuthError::ValidationError(\r\n            \"Password must be at least 5 characters long\".into(),\r\n        ));\r\n    }\r\n\r\n    let salt = SaltString::generate(\u0026mut thread_rng());\r\n    let argon2 = Argon2::default();\r\n    let hashed_password = argon2\r\n        .hash_password(register_data.password.as_bytes(), \u0026salt)?\r\n        .to_string();\r\n\r\n    let db_new_user = DbNewUser {\r\n        name: register_data.name,\r\n        phone_number: register_data.phone_number,\r\n        email: register_data.email,\r\n        password: hashed_password,\r\n        role: role_str.to_string(),\r\n    };\r\n\r\n    conn.transaction(\r\n        |connection: \u0026mut PgConnection| -\u003e Result\u003cDbUser, diesel::result::Error\u003e {\r\n            let created_user = user_repository::create(connection, \u0026db_new_user)?;\r\n\r\n            if role_str == \"courier\" {\r\n                let new_courier = NewCourier {\r\n                    user_id: created_user.id,\r\n                    status: CourierStatus::Free,\r\n                    is_blocked: false,\r\n                    is_deleted: false,\r\n                };\r\n                courier_repository::create(connection, \u0026new_courier)?;\r\n            }\r\n\r\n            Ok(created_user)\r\n        },\r\n    )\r\n    .map_err(AuthError::from)\r\n}\r\n\r\npub fn login(conn: \u0026mut PgConnection, login_data: LoginUserDto) -\u003e Result\u003cAuthResponse, AuthError\u003e {\r\n    let user = user_repository::find_by_phone(conn, \u0026login_data.phone_number)?;\r\n\r\n    let parsed_hash = PasswordHash::new(\u0026user.password)?;\r\n    if Argon2::default()\r\n        .verify_password(login_data.password.as_bytes(), \u0026parsed_hash)\r\n        .is_err()\r\n    {\r\n        tracing::warn!(\r\n            \"Unsuccessful login attempt for phone: {}\",\r\n            login_data.phone_number\r\n        );\r\n        return Err(AuthError::InvalidCredentials);\r\n    }\r\n\r\n    let token = generate_jwt(\u0026user)?;\r\n    tracing::info!(\"User {} successfully logged in\", user.id);\r\n\r\n    Ok(AuthResponse {\r\n        token,\r\n        user_id: user.id,\r\n    })\r\n}\r\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","Danila","RustroverProjects","InnoDelivery","user_service","src","services","courier_service.rs"],"content":"use crate::dto::courier_dto::CourierProfileResponse;\r\nuse crate::models::courier::Courier;\r\nuse crate::models::courier::CourierStatus;\r\nuse crate::repository::courier_repository;\r\nuse crate::services::auth_service::AuthError;\r\nuse diesel::PgConnection;\r\nuse uuid::Uuid;\r\n\r\npub fn get_courier_profile(\r\n    conn: \u0026mut PgConnection,\r\n    uid: Uuid,\r\n) -\u003e Result\u003cCourierProfileResponse, AuthError\u003e {\r\n    let (user_model, courier_model) = courier_repository::find_courier_by_user_id(conn, uid)\r\n        .map_err(|e| AuthError::DatabaseError(e.to_string()))?;\r\n\r\n    let response = CourierProfileResponse {\r\n        id: user_model.id,\r\n        name: user_model.name,\r\n        phone_number: user_model.phone_number,\r\n        email: user_model.email,\r\n        status: courier_model.status,\r\n        average_rating: if courier_model.rating_count \u003e 0 {\r\n            (courier_model.rating_sum / courier_model.rating_count as f64) as f32\r\n        } else {\r\n            0.0\r\n        },\r\n    };\r\n\r\n    Ok(response)\r\n}\r\n\r\npub fn update_courier_status(\r\n    conn: \u0026mut PgConnection,\r\n    uid: Uuid,\r\n    status_data: CourierStatus,\r\n) -\u003e Result\u003cCourierStatus, AuthError\u003e {\r\n    let updated_courier = courier_repository::update_status_by_user_id(conn, uid, status_data)\r\n        .map_err(|e| AuthError::DatabaseError(e.to_string()))?;\r\n    Ok(updated_courier.status)\r\n}\r\n\r\npub fn get_all_couriers(conn: \u0026mut PgConnection) -\u003e Result\u003cVec\u003cCourierProfileResponse\u003e, AuthError\u003e {\r\n    let results =\r\n        courier_repository::get_all(conn).map_err(|e| AuthError::DatabaseError(e.to_string()))?;\r\n\r\n    let profiles = results\r\n        .into_iter()\r\n        .map(|(user_model, courier_model)| CourierProfileResponse {\r\n            id: user_model.id,\r\n            name: user_model.name,\r\n            phone_number: user_model.phone_number,\r\n            email: user_model.email,\r\n            status: courier_model.status,\r\n            average_rating: if courier_model.rating_count \u003e 0 {\r\n                (courier_model.rating_sum / courier_model.rating_count as f64) as f32\r\n            } else {\r\n                0.0\r\n            },\r\n        })\r\n        .collect();\r\n\r\n    Ok(profiles)\r\n}\r\n\r\npub fn set_courier_blocked_status(\r\n    conn: \u0026mut PgConnection,\r\n    courier_user_id: Uuid,\r\n    blocked: bool,\r\n) -\u003e Result\u003cCourier, AuthError\u003e {\r\n    courier_repository::set_blocked_status(conn, courier_user_id, blocked).map_err(AuthError::from)\r\n}\r\n\r\npub fn soft_delete_courier(\r\n    conn: \u0026mut PgConnection,\r\n    courier_user_id: Uuid,\r\n) -\u003e Result\u003cusize, AuthError\u003e {\r\n    courier_repository::soft_delete(conn, courier_user_id).map_err(AuthError::from)\r\n}\r\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","Danila","RustroverProjects","InnoDelivery","user_service","src","services","mod.rs"],"content":"pub mod auth_service;\npub mod courier_service;\npub mod user_service;\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","Danila","RustroverProjects","InnoDelivery","user_service","src","services","user_service.rs"],"content":"use crate::dto::user_dto::UpdateUser;\r\nuse crate::models::user::User as DbUser;\r\nuse crate::repository::user_repository;\r\nuse crate::services::auth_service::AuthError;\r\nuse diesel::PgConnection;\r\nuse uuid::Uuid;\r\n\r\npub fn get_user_profile(conn: \u0026mut PgConnection, user_id: Uuid) -\u003e Result\u003cDbUser, AuthError\u003e {\r\n    user_repository::find_by_id(conn, user_id).map_err(AuthError::from)\r\n}\r\n\r\npub fn update_user_profile(\r\n    conn: \u0026mut PgConnection,\r\n    user_id: Uuid,\r\n    update_data: UpdateUser,\r\n) -\u003e Result\u003cDbUser, AuthError\u003e {\r\n    user_repository::update(conn, user_id, \u0026update_data).map_err(AuthError::from)\r\n}\r\n\r\npub fn soft_delete_user(conn: \u0026mut PgConnection, user_id: Uuid) -\u003e Result\u003cusize, AuthError\u003e {\r\n    user_repository::soft_delete_user(conn, user_id).map_err(AuthError::from)\r\n}\r\n\r\npub fn get_all_users(conn: \u0026mut PgConnection) -\u003e Result\u003cVec\u003cDbUser\u003e, AuthError\u003e {\r\n    user_repository::get_all_users(conn).map_err(AuthError::from)\r\n}\r\n\r\npub fn set_user_blocked eneration_and_claims() {\n    dotenv::dotenv().ok();\n    let user = create_test_user(\"user\");\n    let token = generate_jwt(\u0026user).expect(\"Failed to generate JWT\");\n    let decoded = validate_jwt(\u0026token).expect(\"Failed to validate token\");\n    assert_eq!(decoded.sub, user.id.to_string());\n    assert_eq!(decoded.role, user.role);\n}\n\n#[test]\n/// Test 6: Successful validation of a correct JWT.\nfn test_jwt_validation_success() {\n    dotenv::dotenv().ok();\n    let user = create_test_user(\"admin\");\n    let token = generate_jwt(\u0026user).unwrap();\n    let result = validate_jwt(\u0026token);\n    assert!(result.is_ok());\n    assert_eq!(result.unwrap().role, \"admin\");\n}\n\n#[test]\n/// Test 9: JWT `exp` claim is set to about 24 hours in the future.\nfn test_jwt_expiration_is_set_correctly() {\n    dotenv::dotenv().ok();\n    let user = create_test_user(\"user\");\n    let token = generate_jwt(\u0026user).unwrap();\n    let claims = validate_jwt(\u0026token).unwrap();\n\n    let now = Utc::now().timestamp() as usize;\n    let twenty_four_hours_in_seconds = 24 * 60 * 60;\n\n    assert!(claims.exp \u003e now + twenty_four_hours_in_seconds - 5);\n    assert!(claims.exp \u003c now + twenty_four_hours_in_seconds + 5);\n}\n\n#[test]\n/// Test 13: JWT validation fails for invalid signature.\nfn test_jwt_validation_fails_for_invalid_signature() {\n    dotenv::dotenv().ok();\n    let user = create_test_user(\"user\");\n    let token = generate_jwt(\u0026user).unwrap();\n\n    let wrong_secret = \"a_completely_different_secret\";\n    let decoding_key = DecodingKey::from_secret(wrong_secret.as_ref());\n    let validation = Validation::default();\n\n    let result = decode::\u003cClaims\u003e(\u0026token, \u0026decoding_key, \u0026validation);\n    assert!(result.is_err());\n    assert!(matches!(\n        result.unwrap_err().kind(),\n        jsonwebtoken::errors::ErrorKind::InvalidSignature\n    ));\n}\n","traces":[],"covered":0,"coverable":0},{"path e::{Deserialize, Serialize};\r\nuse uuid::Uuid;\r\n\r\n#[derive(Enum, Debug, Clone, Copy, PartialEq, Eq, Serialize, Deserialize, DbEnum)]\r\n#[ExistingTypePath = \"crate::schema::sql_types::OrderStatus\"]\r\npub enum OrderStatus {\r\n    Draft,\r\n    PendingCarrier,\r\n    InProgress,\r\n    Finished,\r\n    Cancelled,\r\n}\r\n\r\n#[derive(SimpleObject, Queryable, Selectable, Identifiable, Serialize, Debug)]\r\n#[diesel(table_name = orders)]\r\n#[diesel(check_for_backend(diesel::pg::Pg))]\r\npub struct Order {\r\n    pub id: Uuid,\r\n    pub user_id: Uuid,\r\n    pub courier_id: Option\u003cUuid\u003e,\r\n    pub delivery_address: String,\r\n    pub status: OrderStatus,\r\n    pub rating: Option\u003cf32\u003e,\r\n    pub created_at: NaiveDateTime,\r\n    pub updated_at: NaiveDateTime,\r\n}\r\n\r\n#[derive(Insertable, Debug)]\r\n#[diesel(table_name = orders)]\r\npub struct NewOrder {\r\n    pub user_id: Uuid,\r\n    pub courier_id: Option\u003cUuid\u003e,\r\n    pub delivery_address: String,\r\n    pub status: OrderStatus,\r\n}\r\n\r\n#[derive(Queryable, Selectable, Identifiable, Serialize, Debug)]\r\n#[diesel(table_name = products)]\r\n#[diesel(check_for_backend(diesel::pg::Pg))]\r\npub struct Product {\r\n    pub id: Uuid,\r\n    pub product_type: String,\r\n    pub product_name: String,\r\n    pub restaurant: String,\r\n    pub price: f32,\r\n    pub created_at: NaiveDateTime,\r\n    pub updated_at: NaiveDateTime,\r\n}\r\n\r\n#[derive(Queryable, Selectable, Associations, Serialize, Debug)]\r\n#[diesel(belongs_to(Order))]\r\n#[diesel(belongs_to(Product))]\r\n#[diesel(table_name = order_products)]\r\n#[diesel(check_for_backend(diesel::pg::Pg))]\r\npub struct OrderProduct {\r\n    pub order_id: Uuid,\r\n    pub product_id: Uuid,\r\n    pub quantity: i32,\r\n}\r\n\r\n#[derive(Insertable, Debug)]\r\n#[diesel(table_name = order_products)]\r\npub struct NewOrderProduct {\r\n    pub order_id: Uuid,\r\n    pub product_id: Uuid,\r\n    pub quantity: i32,\r\n}\r\n","traces \n    diesel::update(orders::table.find(order_uuid))\r\n        .set(orders::status.eq(new_status))\r\n        .get_result(conn)\r\n}\r\n\r\npub fn update_order_address(\r\n    conn: \u0026mut PgConnection,\r\n    order_uuid: Uuid,\r\n    new_address: \u0026str,\r\n) -\u003e Result\u003cOrder, DieselError\u003e {\r\n    diesel::update(orders::table.find(order_uuid))\r\n        .set(orders::delivery_address.eq(new_address))\r\n        .get_result(conn)\r\n}\r\n\r\npub fn list_orders_by_user(\r\n    conn: \u0026mut PgConnection,\r\n    user_uuid: Uuid,\r\n    limit: i64,\r\n    offset: i64,\r\n) -\u003e Result\u003cVec\u003cOrder\u003e, DieselError\u003e {\r\n    orders::table\r\n        .filter(orders::user_id.eq(user_uuid))\r\n        .order(orders::created_at.desc())\r\n        .limit(limit)\r\n        .offset(offset)\r\n        .load::\u003cOrder\u003e(conn)\r\n}\r\n\r\npub fn find_missing_product_ids(\r\n    conn: \u0026mut PgConnection,\r\n    product_ids: \u0026[Uuid],\r\n) -\u003e Result\u003cVec\u003cUuid\u003e, DieselError\u003e {\r\n    if product_ids.is_empty() {\r\n        return Ok(vec![]);\r\n    }\r\n\r\n    let existing: Vec\u003cUuid\u003e = products::table\r\n        .filter(products::id.eq_any(product_ids))\r\n        .select(products::id)\r\n        .load(conn)?;\r\n\r\n    let existing_set: std::collections::HashSet\u003cUuid\u003e = existing.into_iter().collect();\r\n\r\n    Ok(product_ids\r\n        .iter()\r\n        .cloned()\r\n        .filter(|id| !existing_set.contains(id))\r\n        .collect())\r\n}\r\n\r\npub fn find_expired_pending_orders(\r\n    conn: \u0026mut PgConnection,\r\n    created_before: chrono::NaiveDateTime,\r\n) -\u003e Result\u003cVec\u003cOrder\u003e, DieselError\u003e {\r\n    use crate::schema::orders::dsl::{created_at, status};\r\n\r\n    crate::schema::orders::table\r\n        .filter(status.eq(OrderStatus::PendingCarrier))\r\n        .filter(created_at.lt(created_before))\r\n        .load::\u003cOrder\u003e(conn)\r\n}\r\n\r\npub fn update_order_status_and_courier(\r\n    conn: \u0026mut PgConnection,\r\n    order_uuid: Uuid,\r\n    new_status: OrderStatus,\r\n    courier_id: Option\u003cUuid\u003e,\r\n) -\u003e Result\u003cOrder, DieselError\u003e {\r\n    diesel::update(orders::table.find(order_uuid))\r\n        .set((\r\n            orders::status.eq(new_status),\r\n            orders::courier_id.eq(courier_id),\r\n            orders::updated_at.eq(chrono::Utc::now().naive_utc()),\r\n        ))\r\n        .get_result(conn)\r\n}\r\n\r\npub fn rate_order_in_window(\r\n    conn: \u0026mut PgConnection,\r\n    order_uuid: Uuid,\r\n    rating: f32,\r\n    rating_window_minutes: i32,\r\n) -\u003e Result\u003cOrder, DieselError\u003e {\r\n    use crate::schema::orders;\r\n\r\n    if !(1.0..=5.0).contains(\u0026rating) {\r\n        return Err(DieselError::QueryBuilderError(\r\n            \"Invalid rating value\".into(),\r\n        ));\r\n    }\r\n\r\n    let rating_window = chrono::Duration::minutes(i64::from(rating_window_minutes));\r\n    let max_rating_time = chrono::Utc::now().naive_utc() - rating_window;\r\n\r\n    diesel::update(\r\n        orders::table\r\n            .find(order_uuid)\r\n            .filter(orders::status.eq(OrderStatus::Finished))\r\n            .filter(orders::updated_at.gt(max_rating_time))\r\n            .filter(orders::rating.is_null()),\r\n    )\r\n    .set((\r\n        orders::rating.eq(rating),\r\n        orders::updated_at.eq(chrono::Utc::now().naive_utc()),\r\n    ))\r\n    .get_result(conn)\r\n}\r\n","traces":[{"line":13,"address":[],"length":0,"stats":{"Line":2666130979403333632}},{"line":18,"address":[],"length":0,"stats":{"Line":10664523917613334528}},{"line":19,"address":[],"length":0,"stats":{"Line":15852670688344145920}},{"line":20,"address":[],"length":0,"stats":{"Line":10664523917613334528}},{"line":21,"address":[],"length":0,"stats":{"Line":10808639105689190400}},{"line":23,"address":[],"length":0,"stats":{"Line":15564440312192434176}}, ) -\u003e Self {\n        OrderServiceError::DatabaseError(error.to_string())\n    }\n}\n\nimpl From\u003creqwest::Error\u003e for OrderServiceError {\n    fn from(error: reqwest::Error) -\u003e Self {\n        OrderServiceError::UserServiceError(error.to_string())\n    }\n}\n\nfn handle_rating_error(e: diesel::result::Error) -\u003e OrderServiceError {\n    if e == diesel::result::Error::NotFound || e == diesel::result::Error::RollbackTransaction {\n        OrderServiceError::RatingWindowExpired\n    } else {\n        OrderServiceError::DatabaseError(e.to_string())\n    }\n}\n\npub async fn rate_order(\n    pool: \u0026DbPool,\n    user_service_url: \u0026str,\n    order_id: Uuid,\n    user_id: Uuid,\n    rating: f32,\n    rating_window_minutes: i32,\n) -\u003e Result\u003cOrder, OrderServiceError\u003e {\n    if !(1.0..=5.0).contains(\u0026rating) {\n        return Err(OrderServiceError::InvalidRating);\n    }\n\n    let mut conn = pool\n        .get()\n        .map_err(|e| OrderServiceError::DatabaseError(e.to_string()))?;\n\n    let order = order_repository::find_order_by_id(\u0026mut conn, order_id)?;\n\n    if order.user_id != user_id {\n        return Err(OrderServiceError::InvalidInput(\n            \"Order not found\".to_string(),\n        ));\n    }\n\n    let updated_order =\n        order_repository::rate_order_in_window(\u0026mut conn, order_id, rating, rating_window_minutes)\n            .map_err(handle_rating_error)?;\n\n    if let Some(courier_id) = updated_order.courier_id {\n        let client = reqwest::Client::new();\n        let url = format!(\"{}/internal/couriers/set_rating\", user_service_url);\n        let body = serde_json::json!({\n            \"courier_id\": courier_id,\n            \"rating\": rating\n        });\n\n        match client.post(\u0026url).json(\u0026body).send().await {\n            Ok(response) =\u003e {\n                if response.status().is_success() {\n                    log::info!(\"Successfully updated courier rating in user_service\");\n                } else {\n                    log::error!(\n                        \"Failed to update courier rating: HTTP {}\",\n                        response.status()\n                    );\n                }\n            }\n            Err(e) =\u003e {\n                log::error!(\"Error calling user_service to update rating: {}\", e);\n            }\n        }\n    }\n\n    Ok(updated_order)\n}\n\npub async fn create_order(\n    pool: \u0026DbPool,\n    user_service_url: \u0026str,\n    user_id: Uuid,\n    delivery_address: \u0026str,\n    products: Vec\u003cOrderProductData\u003e,\n) -\u003e Result\u003cOrder, OrderServiceError\u003e {\n    log::info!(\n        \"[CREATE_ORDER] Called with user_id={}, delivery_address={}, products={:?}\",\n        user_id,\n        delivery_address,\n        products\n    );\n\n    let mut conn = pool\n        .get()\n        .map_err(|e| OrderServiceError::DatabaseError(e.to_string()))?;\n\n    let product_ids: Vec\u003cUuid\u003e = products.iter().map(|p| p.product_id).collect();\n    let missing = order_repository::find_missing_product_ids(\u0026mut conn, \u0026product_ids)?;\n    if !missing.is_empty() {\n        log::warn!(\"[CREATE_ORDER] Missing products: {:?}\", missing);\n        return Err(OrderServiceError::InvalidInput(format!(\n            \"Unknown product ids: {:?}\",\n            missing\n        )));\n    }\n\n    if is_user_blocked(user_service_url, user_id).await? {\n        log::warn!(\"[CREATE_ORDER] User is blocked: {}\", user_id);\n        return Err(OrderServiceError::InvalidInput(\n            \"User is blocked\".to_string(),\n        ));\n    }\n\n    let courier_id_option = try_assign_courier(user_service_url).await?;\n    log::info!(\n        \"[CREATE_ORDER] Courier assignment result: {:?}\",\n        courier_id_option\n    );\n    let order_status;\n    let final_courier_id;\n\n    if let Some(courier_id) = courier_id_option {\n        let busy_result = set_courier_busy(user_service_url, courier_id).await;\n        log::debug!(\"[CREATE_ORDER] set_courier_busy result: {:?}\", busy_result);\n        if busy_result.is_ok() {\n            order_status = OrderStatus::InProgress;\n            final_courier_id = Some(courier_id);\n        } else {\n            log::warn!(\"[CREATE_ORDER] set_courier_busy failed, courier will not be assigned\");\n            let _ = release_courier(user_service_url, courier_id).await;\n            order_status = OrderStatus::PendingCarrier;\n            final_courier_id = None;\n        }\n    } else {\n        log::info!(\"[CREATE_ORDER] No courier assigned, status PendingCarrier\");\n        order_status = OrderStatus::PendingCarrier;\n        final_courier_id = None;\n    }\n\n    let new_order = NewOrder {\n        user_id,\n        courier_id: final_courier_id,\n        delivery_address: delivery_address.to_string(),\n        status: order_status,\n    };\n    log::info!(\"[CREATE_ORDER] NewOrder struct: {:?}\", new_order);\n\n    let result = order_repository::create_order(\u0026mut conn, new_order, products);\n    match \u0026result {\n        Ok(order) =\u003e {\n            log::info!(\n                \"[CREATE_ORDER] Order successfully created! id={:?}\",\n                order.id\n            );\n        }\n        Err(e) =\u003e {\n            log::error!(\"[CREATE_ORDER] Error during order creation: {:?}\", e);\n        }\n    }\n    result.map_err(OrderServiceError::from)\n}\n\npub async fn set_courier_busy(\n    user_service_url: \u0026str,\n    courier_id: Uuid,\n) -\u003e Result\u003c(), OrderServiceError\u003e {\n    let url = format!(\"{}/internal/couriers/busy\", user_service_url);\n    let body = serde_json::json!({\n        \"courier_id\": courier_id\n    });\n    reqwest::Client::new()\n        .post(\u0026url)\n        .json(\u0026body)\n        .send()\n        .await?\n        .error_for_status()?;\n    Ok(())\n}\n\npub async fn is_user_blocked(\n    user_service_url: \u0026str,\n    user_id: Uuid,\n) -\u003e Result\u003cbool, OrderServiceError\u003e {\n    let url = format!(\"{}/internal/users/{}/blocked\", user_service_url, user_id);\n    log::debug!(\" Sending request to: {}\", url);\n\n    let client = reqwest::Client::new();\n    let resp = client.get(\u0026url).send().await?;\n\n    log::debug!(\" Received response status: {}\", resp.status());\n\n    if resp.status().is_success() {\n        let body = resp.text().await?;\n        log::debug!(\" Response body: {}\", body);\n\n        let v: serde_json::Value = serde_json::from_str(\u0026body).map_err(|e| {\n            OrderServiceError::UserServiceError(format!(\"Failed to parse JSON: {}\", e))\n        })?;\n\n        Ok(v.get(\"is_blocked\")\n            .and_then(|b| b.as_bool())\n            .unwrap_or(false))\n    } else {\n        log::error!(\" Request failed with status: {}\", resp.status());\n        Err(OrderServiceError::UserServiceError(format!(\n            \"User service returned error status: {}\",\n            resp.status()\n        )))\n    }\n}\n\npub async fn try_assign_courier(user_service_url: \u0026str) -\u003e Result\u003cOption\u003cUuid\u003e, OrderServiceError\u003e {\n    let url = format!(\"{}/internal/couriers/assign\", user_service_url);\n    log::debug!(\" Sending courier assignment request to: {}\", url);\n\n    let client = reqwest::Client::new();\n    let resp = client.post(\u0026url).send().await?;\n\n    log::debug!(\" Received response status: {}\", resp.status());\n\n    if resp.status().as_u16() == 204 {\n        log::debug!(\" No courier available (204 No Content)\");\n        return Ok(None);\n    }\n\n    if resp.status().is_success() {\n        let body = resp.text().await?;\n        log::debug!(\" Response body: {}\", body);\n\n        let v: serde_json::Value = serde_json::from_str(\u0026body).map_err(|e| {\n            OrderServiceError::UserServiceError(format!(\"Failed to parse JSON: {}\", e))\n        })?;\n\n        let id = v\n            .get(\"courier_id\")\n            .and_then(|s| s.as_str())\n            .and_then(|s| Uuid::parse_str(s).ok());\n\n        log::debug!(\" Parsed courier_id: {:?}\", id);\n        Ok(id)\n    } else {\n        let status = resp.status();\n        let body = resp.text().await.map_err(|e| {\n            OrderServiceError::UserServiceError(format!(\"Failed to get response body: {}\", e))\n        })?;\n        let error_msg = format!(\n            \"User service returned unexpected status: {} - Body: {}\",\n            status, body\n        );\n        log::error!(\"{}\", error_msg);\n        Err(OrderServiceError::UserServiceError(error_msg))\n    }\n}\npub async fn release_courier(\n    user_service_url: \u0026str,\n    courier_id: Uuid,\n) -\u003e Result\u003c(), reqwest::Error\u003e {\n    let url = format!(\"{}/internal/couriers/free\", user_service_url);\n    let body = serde_json::json!({\"courier_id\": courier_id});\n    let resp = reqwest::Client::new().post(\u0026url).json(\u0026body).send().await?;\n\n    if resp.status().is_success() {\n        Ok(())\n    } else {\n        Err(resp.error_for_status().unwrap_err())\n    }\n}\n\npub async fn complete_order(\n    pool: \u0026DbPool,\n    user_service_url: \u0026str,\n    order_id: Uuid,\n) -\u003e Result\u003cOrder, OrderServiceError\u003e {\n    let mut conn = pool\n        .get()\n        .map_err(|e| OrderServiceError::DatabaseError(e.to_string()))?;\n\n    let order = order_repository::find_order_by_id(\u0026mut conn, order_id)?;\n    if let Some(courier_id) = order.courier_id {\n        release_courier(user_service_url, courier_id).await?;\n    }\n    order_repository::update_order_status(\u0026mut conn, order_id, OrderStatus::Finished)\n        .map_err(OrderServiceError::from)?;\n    let updated_order = order_repository::find_order_by_id(\u0026mut conn, order_id)?;\n    Ok(updated_order)\n}\n\npub async fn process_pending_orders(\n    pool: \u0026DbPool,\n    user_service_url: \u0026str,\n    timeout_seconds: i64,\n) -\u003e Result\u003cusize, OrderServiceError\u003e {\n    let mut conn = pool\n        .get()\n        .map_err(|e| OrderServiceError::DatabaseError(e.to_string()))?;\n\n    let pending_orders = order_repository::find_expired_pending_orders(\n        \u0026mut conn,\n        chrono::Utc::now().naive_utc() - chrono::Duration::seconds(timeout_seconds),\n    )?;\n\n    let mut processed = 0;\n\n    for order in pending_orders {\n        if let Some(courier_id) = try_assign_courier(user_service_url).await? {\n            order_repository::update_order_status_and_courier(\n                \u0026mut conn,\n                order.id,\n                OrderStatus::InProgress,\n                Some(courier_id),\n            )?;\n        } else {\n            order_repository::update_order_status(\u0026mut conn, order.id, OrderStatus::Cancelled)?;\n        }\n\n        processed += 1;\n    }\n\n    Ok(processed)\n}\n\npub async fn cancel_order_wrapper(\n    pool: \u0026DbPool,\n    order_id: Uuid,\n) -\u003e Result\u003cOrder, OrderServiceError\u003e {\n    let mut conn = pool\n        .get()\n        .map_err(|e| OrderServiceError::DatabaseError(e.to_string()))?;\n    order_repository::update_order_status(\u0026mut conn, order_id, OrderStatus::Cancelled)\n        .map_err(OrderServiceError::from)?;\n    let updated_order = order_repository::find_order_by_id(\u0026mut conn, order_id)?;\n    Ok(updated_order)\n}\n\npub async fn update_order_address(\n    pool: \u0026DbPool,\n    order_id: Uuid,\n    new_address: \u0026str,\n) -\u003e Result\u003cOrder, OrderServiceError\u003e {\n    log::info!(\n        \"[UPDATE_ADDRESS] Called for order_id={} with new_address={}\",\n        order_id,\n        new_address\n    );\n\n    let mut conn = pool\n        .get()\n        .map_err(|e| OrderServiceError::DatabaseError(e.to_string()))?;\n\n    let updated_order = order_repository::update_order_address(\u0026mut conn, order_id, new_address)?;\n\n    log::info!(\n        \"[UPDATE_ADDRESS] Successfully updated address for order_id={}\",\n        order_id\n    );\n\n    Ok(updated_order)\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use diesel::result::Error as DieselError;\n\n    #[test]\n    fn test_handle_rating_error_not_found() {\n        let err = DieselError::NotFound;\n        let res = handle_rating_error(err);\n        assert!(matches!(res, OrderServiceError::RatingWindowExpired));\n    }\n\n    #[test]\n    fn test_handle_rating_error_rollback() {\n        let err = DieselError::RollbackTransaction;\n        let res = handle_rating_error(err);\n        assert!(matches!(res, OrderServiceError::RatingWindowExpired));\n    }\n\n    #[test]\n    fn test_handle_rating_error_other() {\n        let custom_msg = \"My custom DB error\";\n        let err = DieselError::QueryBuilderError(custom_msg.into());\n        let res = handle_rating_error(err);\n        if let OrderServiceError::DatabaseError(msg) = res {\n            assert!(msg.contains(custom_msg));\n        } else {\n            panic!(\"Expected DatabaseError\");\n        }\n    }\n}\n","traces":[{"line":19,"address":[],"length":0,"stats":{"Line":4035225266123964416}},{"line":20,"address":[],"length":0,"stats":{"Line":4035225266123964416}},{"line":21,"address":[],"length":0,"stats":{"Line":6341068275337658368}},{"line":22,"address":[],"length":0,"stats":{"Line":2882303761517117440}},{"line":23,"address":[],"length":0,"stats":{"Line":3458764513820540928}},{"line":24,"address":[],"length":0,"stats":{"Line":864691128455135232}},{"line":25,"address":[],"length":0,"stats":{"Line":1729382256910270464}},{"line":31,"address":[],"length":0,"stats":{"Line":1152921504606846976}},{"line":32,"address":[],"length":0,"stats":{"Line":1152921504606846976}},{"line":37,"address":[],"length":0,"stats":{"Line":720575940379279360}},{"line":38,"address":[],"length":0,"stats":{"Line":720575940379279360}},{"line":42,"address":[],"length":0,"stats":{"Line":576460752303423488}},{"  status\n            }}\n        }}\n        \"#,\n        order.id\n    );\n\n    let request = Request::post(\"/\")\n        .header(\"Content-Type\", \"application/json\")\n        .body(json!({ \"query\": mutation }).to_string())\n        .unwrap();\n\n    let response = app.oneshot(request).await.unwrap();\n    assert_eq!(response.status(), StatusCode::OK);\n\n    let body = axum::body::to_bytes(response.into_body(), usize::MAX)\n        .await\n        .unwrap();\n    let json: serde_json::Value = serde_json::from_slice(\u0026body).unwrap();\n\n    let data = \u0026json[\"data\"][\"cancelOrder\"];\n    assert_eq!(data[\"id\"], order.id.to_string());\n    assert_eq!(data[\"status\"], \"CANCELLED\");\n}\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","Danila","RustroverProjects","InnoDelivery","order_service","tests","integration_tests","create_db_pool_success.rs"],"content":"use order_service::db;\nuse std::env;\n\n#[tokio::test]\nasync fn test_create_db_pool_success() {\n    dotenvy::dotenv().ok();\n    let test_db_url =\n        env::var(\"DATABASE_URL_ORDER_TEST\").expect(\"DATABASE_URL_ORDER_TEST must be set\");\n\n    env::set_var(\"DATABASE_URL_ORDER\", \u0026test_db_url);\n\n    let pool_result = db::create_db_pool();\n\n    assert!(\n        pool_result.is_ok(),\n        \"Failed to create DB pool with valid config\"\n    );\n    let _pool = pool_result.unwrap();\n\n    env::remove_var(\"DATABASE_URL_ORDER\");\n}\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","Danila","RustroverProjects","InnoDelivery","order_service","tests","integration_tests","create_order_assign_fails.rs"],"content":"use crate::fakers;\nuse crate::helpers;\nuse axum::http::{Request, StatusCode};\nuse httpmock::Method::{GET, POST};\nuse serde_json::json;\nuse std::env;\nuse tower::ServiceExt;\nuse uuid::Uuid;\n\n#[tokio::test]\nasync fn create_order_assign_fails_with_500() {\n    dotenvy::dotenv().ok();\n    let db_url =\n        env::var(\"DATABASE_URL_ORDER_TEST\").expect(\"DATABASE_URL_ORDER_TEST needs to be set\");\n    let (app, pool, server) = helpers::setup_test_app(\u0026*db_url).await;\n\n    let prod_id = {\n        let mut conn = pool.get().expect(\"pool conn\");\n        fakers::insert_product(\u0026mut conn)\n    };\n    let user_id = Uuid::new_v4();\n\n    let user_mock = server.mock(|when, then| {\n        when.method(GET)\n            .path(format!(\"/internal/users/{}/blocked\", user_id));\n        then.status(200).body(r#\"{\"is_blocked\":false}\"#);\n    });\n\n    let assign_mock = server.mock(|when, then| {\n        when.method(POST).path(\"/internal/couriers/assign\");\n        then.status(500).body(\"Internal Server Error\");\n    });\n\n    let mutation = format!(\n        r#\"\n        mutation CreateOrder {{\n            createOrder(\n                userId: \"{}\",\n                deliveryAddress: \"addr assign fail\",\n                products: [ {{ productId: \"{}\", quantity: 1 }} ]\n            ) {{\n                id\n            }}\n        }}\n        \"#,\n        user_id, prod_id\n    );\n\n    let request = Request::post(\"/\")\n        .header(\"Content-Type\", \"application/json\")\n        .body(json!({ \"query\": mutation }).to_string())\n        .unwrap();\n\n    let response = app.oneshot(request).await.unwrap();\n\n    assert_eq!(response.status(), StatusCode::OK);\n\n    let body = axum::body::to_bytes(response.into_body(), usize::MAX)\n        .await\n        .unwrap();\n    let json_body: serde_json::Value = serde_json::from_slice(\u0026body).unwrap();\n\n    assert!(json_body[\"data\"].is_null());\n    let errors = json_body[\"errors\"].as_array().unwrap();\n    let error = \u0026errors[0];\n    let error_message = error[\"message\"].as_str().unwrap();\n\n    assert!(error_message.contains(\"User service returned unexpected status: 500\"));\n\n    user_mock.assert();\n    assign_mock.assert();\n}\n","traces":[],"covered":0,"coverable":0},{"path":["C:","             let mut buf = [0u8; 1024];\n            // Блокирующее чтение\n            let _ = stream.read(\u0026mut buf);\n\n            // Отправляем заголовки: статус 500 и Content-Length: 100\n            let response = b\"HTTP/1.1 500 Internal Server Error\\r\\n\\\n                             Content-Type: text/plain\\r\\n\\\n                             Content-Length: 100\\r\\n\\\n                             \\r\\n\\\n                             Short\"; // Тело короче, чем заявлено (всего 5 байт)\n\n            // Блокирующая запись\n            let _ = stream.write(response);\n            // Поток завершается, соединение закрывается.\n            // Клиент (reqwest) ждет еще 95 байт и падает с ошибкой \"premature EOF\".\n        }\n    });\n\n    // Асинхронный вызов сервиса\n    let result =\n        order_service::services::order_service::try_assign_courier(\u0026user_service_url).await;\n\n    assert!(result.is_err());\n    let err_msg = result.unwrap_err().to_string();\n\n    // Проверяем, что сработала ветка map_err (строка 271)\n    assert!(err_msg.contains(\"Failed to get response body\"));\n}\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","Danila","RustroverProjects","InnoDelivery","order_service","tests","integration_tests","order_service_correct_tracing.rs"],"content":"use crate::helpers;\nuse httpmock::Method::{GET, POST};\nuse order_service::repository::order_repository::OrderProductData;\nuse serde_json::json;\nuse std::env;\nuse tracing::Level;\nuse uuid::Uuid;\n\n#[tokio::test]\nasync fn test_logging_coverage_create_order() {\n    dotenvy::dotenv().ok();\n\n    let _ = tracing_subscriber::fmt()\n        .with_max_level(Level::DEBUG)\n        .with_test_writer()\n        .try_init();\n\n    let db_url = env::var(\"DATABASE_URL_ORDER_TEST\").expect(\"Env var not set\");\n    let (_app, pool, server) = helpers::setup_test_app(\u0026db_url).await;\n\n    let user_id = Uuid::new_v4();\n    let courier_id = Uuid::new_v4();\n    let prod_id = {\n        let mut conn = pool.get().expect(\"pool\");\n        crate::fakers::insert_product(\u0026mut conn)\n    };\n\n    // Мокаем успешное назначение курьера\n    server.mock(|when, then| {\n        when.method(POST).path(\"/internal/couriers/assign\");\n        then.status(200)\n            .header(\"content-type\", \"application/json\")\n            .body(json!({\"courier_id\": courier_id}).to_string());\n    });\n\n    server.mock(|when, then| {\n        when.method(POST).path(\"/internal/couriers/busy\");\n        then.status(200);\n    });\n\n    // Мокаем проверку юзера\n    server.mock(|when, then| {\n        when.method(GET)\n            .path(format!(\"/internal/users/{}/blocked\", user_id));\n        then.status(200).body(r#\"{\"is_blocked\":false}\"#);\n    });\n\n    let result = order_service::services::order_service::create_order(\n        \u0026pool,\n        \u0026server.base_url(),\n        user_id,\n        \"addr log test\",\n        vec![OrderProductData {\n            product_id: prod_id,\n            quantity: 1,\n        }],\n    )\n    .await;\n\n    assert!(result.is_ok());\n}\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","Danila","RustroverProjects","InnoDelivery","order_service","tests","integration_tests","order_service_rate_rollback_transaction.rs"],"content":"use crate::helpers;\nuse diesel::ExpressionMethods;\nuse diesel::QueryDsl;\nuse diesel::RunQueryDsl;\nuse dotenvy::dotenv;\nuse order_service::models::{NewOrder, OrderStatus};\nuse order_service::repository::order_repository::{self, OrderProductData};\nuse order_service::services::order_service::{rate_order, OrderServiceError};\nuse std::env;\nuse uuid::Uuid;\n\n#[tokio::test]\nasync fn rate_order_rollback_transaction_error() {\n    dotenv().ok();\n    let db_url =\n        env::var(\"DATABASE_URL_ORDER_TEST\").expect(\"DATABASE_URL_ORDER_TEST needs to be set\");\n    let (app, pool, server) = helpers::setup_test_app(\u0026*db_url).awa stroverProjects","InnoDelivery","user_service","src","auth","middleware.rs"],"content":"use crate::auth::jwt::{Claims, validate_jwt};\r\nuse actix_web::{FromRequest, HttpRequest, dev::Payload, error::ErrorUnauthorized, http};\r\nuse std::future::{Ready, ready};\r\nuse tracing;\r\n\r\npub struct JwtMiddleware {\r\n    pub claims: Claims,\r\n}\r\n\r\nimpl FromRequest for JwtMiddleware {\r\n    type Error = actix_web::Error;\r\n    type Future = Ready\u003cResult\u003cSelf, Self::Error\u003e\u003e;\r\n\r\n    fn from_request(req: \u0026HttpRequest, _: \u0026mut Payload) -\u003e Self::Future {\r\n        let auth_header = match req.headers().get(http::header::AUTHORIZATION) {\r\n            Some(header) =\u003e header,\r\n            None =\u003e {\r\n                return ready(Err(ErrorUnauthorized(\"There is no authentication token\")));\r\n            }\r\n        };\r\n\r\n        let auth_str = match auth_header.to_str() {\r\n            Ok(s) =\u003e s,\r\n            Err(_) =\u003e {\r\n                return ready(Err(ErrorUnauthorized(\r\n                    \"Incorrect format of authentication headline\",\r\n                )));\r\n            }\r\n        };\r\n\r\n        if !auth_str.starts_with(\"Bearer \") {\r\n            return ready(Err(ErrorUnauthorized(\r\n                \"The wrong authentication scheme is expected 'Bearer token'\",\r\n            )));\r\n        }\r\n\r\n        let token = \u0026auth_str[\"Bearer \".len()..];\r\n\r\n        match validate_jwt(token) {\r\n            Ok(claims) =\u003e ready(Ok(JwtMiddleware { claims })),\r\n            Err(e) =\u003e {\r\n                tracing::error!(\"JWT validation error: {}\", e);\r\n                ready(Err(ErrorUnauthorized(\"Unimportant or expired token\")))\r\n            }\r\n        }\r\n    }\r\n}\r\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","Danila","RustroverProjects","InnoDelivery","user_service","src","auth","mod.rs"],"content":"pub mod guard;\npub mo
