version: '3.8'

services:

  order_postgres_db:
    image: postgres:16-alpine
    container_name: inno_delivery_postgres_order
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: inno_delivery_order
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  order_postgres_db_test:
    image: postgres:16-alpine
    container_name: inno_delivery_postgres_order_test
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: inno_delivery_order_test
    ports:
      - "5436:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
volumes:
  postgres_data:
  postgres_test_data: